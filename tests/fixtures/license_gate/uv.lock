version = 1
revision = 3
requires-python = ">=3.10"

[[package]]
name = "fixture-root"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "evilpkg" },
    { name = "okpkg" },
    { name = "winonly", marker = "sys_platform == 'win32'" },
]

[package.optional-dependencies]
dev = [
    { name = "devonly" },
]
sftp = [
    { name = "lgplpkg" },
]

[[package]]
name = "childpkg"

[[package]]
name = "devonly"
version = "3.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "evilpkg"
version = "2.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "lgplpkg"
version = "1.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "okpkg"
version = "1.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "childpkg" },
]

[[package]]
name = "winonly"

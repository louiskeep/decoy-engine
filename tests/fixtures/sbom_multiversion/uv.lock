version = 1
revision = 3
requires-python = ">=3.10"

[[package]]
name = "devtool"
version = "0.1.0"
source = { git = "https://example.invalid/devtool.git?rev=abc#abc" }

[[package]]
name = "leaf"
version = "1.0"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/aa/leaf-1.0.tar.gz", hash = "sha256:1111111111111111111111111111111111111111111111111111111111111111", size = 1 }

[[package]]
name = "multi"
version = "1.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "leaf" },
]
sdist = { url = "https://files.pythonhosted.org/packages/aa/multi-1.0.tar.gz", hash = "sha256:2222222222222222222222222222222222222222222222222222222222222222", size = 1 }

[[package]]
name = "multi"
version = "2.0"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/aa/multi-2.0.tar.gz", hash = "sha256:3333333333333333333333333333333333333333333333333333333333333333", size = 1 }

[[package]]
name = "root"
version = "1.0.0"
source = { virtual = "." }
dependencies = [
    { name = "multi", version = "1.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "multi", version = "2.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
]

[package.dev-dependencies]
dev = [
    { name = "devtool" },
]

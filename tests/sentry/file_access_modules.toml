# The exact modules a sink call may live in without a registry entry (plan D9). Being inside
# `decoy_engine/fileaccess/` grants nothing: every other file there, and `_local.py` (whose
# ambient opens each carry their own registry entry), is judged call by call.

# Rule 1: adapters hand a third-party library only a capability's descriptor or library path.
adapter_modules = [
  "decoy_engine/fileaccess/adapters/arrow.py",
  "decoy_engine/fileaccess/adapters/pandas.py",
  "decoy_engine/fileaccess/adapters/polars.py",
  "decoy_engine/fileaccess/adapters/duckdb.py",
  "decoy_engine/fileaccess/adapters/serial.py",
]

# Rule 2: raw fd-relative primitives only, with a held descriptor and a validated name.
capability_modules = [
  "decoy_engine/fileaccess/_rooted.py",
  "decoy_engine/fileaccess/_output.py",
  "decoy_engine/fileaccess/_preopened.py",
  "decoy_engine/fileaccess/_openat2.py",
]

# Public functions in a capability module that take a held descriptor. They are the named creation
# choke points (F25 S1a-0, plan 4.2): their `dir_fd` parameter counts as held, as for a private
# helper. Their name parameter is still traced: each must validate it itself.
capability_creators = [
  "decoy_engine/fileaccess/_output.py::make_stage_dir_at",
  "decoy_engine/fileaccess/_output.py::create_output_file_at",
]

# The only module that may construct `LocalFileAccess`.
local_constructors = [
  "decoy_engine/fileaccess/_entry.py",
]

# Modules whose registry entries may be `ambient_only`: they act on a caller path only after
# the entry point refused every policy but the ambient CLI one.
ambient_only_modules = [
  "decoy_engine/connectors/postgres_snapshot.py",
  "decoy_engine/execution/_isolated_commit.py",
  # F29 commit evidence: called only from _isolated_run.py with its staging_dir, after the guard.
  "decoy_engine/execution/_isolated_reason.py",
  "decoy_engine/execution/_isolated_run.py",
  # F06 local quarantine store: opens beneath the caller-given root only after the guard.
  "decoy_engine/declared_casting/_quarantine_local.py",
]

# Modules that must call `fileaccess.require_ambient`, the guard the ambient-only entries rely on.
ambient_guards = [
  "decoy_engine/connectors/postgres_snapshot.py",
  "decoy_engine/execution/_isolated_run.py",
  # F06 local quarantine store: opens beneath the caller-given root only after the guard.
  "decoy_engine/declared_casting/_quarantine_local.py",
  # LIB L0.1 allocator: calls require_ambient for any caller path.
  "decoy_engine/fileaccess/_protected_dir.py",
]

# F25 plan 4.1. Both keys are exact, both ways: an unlisted module fails, and so does a listed
# module with no such call. Each producer slice adds its modules when they start calling.
# Modules that release a scratch arena path (`ScratchArena.local_path`, the one path release).
scratch_path_release = [
  "decoy_engine/execution/out_of_core/_runner.py",
]
# Modules that call `scratch_native`; in each, every DuckDB connection or result call must go
# through it (no bare `conn.execute(...)`, bound-method or `getattr` call).
scratch_native = []

# Documented exception (owner decision 2026-10-31, A-4 x F13): file paths a third-party library
# opens that come only from OPERATOR-set process environment, never from a job config or a caller
# argument. The sink scan cannot see them (the library opens the file), so each entry names the
# function and the exact variables; `test_operator_environment_exceptions_are_current` fails when
# the function goes away or reads a variable not listed here.
[[operator_environment]]
module = "decoy_engine/secret_providers/vault.py"
function = "client_from_env"
variables = ["VAULT_CACERT", "VAULT_CLIENT_CERT", "VAULT_CLIENT_KEY"]
owner = "cam"
reason = "Vault KV TLS CA bundle and client certificate/key paths: hvac/requests open them; set by the operator, like VAULT_ADDR and VAULT_TOKEN"
removal = "remove when the Vault adapter takes TLS material through FileRole handles (or when a policy-issued SSLContext is passed in)"

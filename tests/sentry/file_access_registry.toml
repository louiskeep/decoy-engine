# Reviewed registry of sink call sites (plan D9, rule 3), one entry per call site.
# `ordinal` is the index of the call among identical sinks in the function. An entry may be
# removed freely; adding one needs a `rule` (how the path is built), an `owner` and a `reason`.
# `ambient_only` marks a caller-derived path that is reached only after `require_ambient`.
# `dir_category` (protected_root, protected_child, output_parent, published_output, non_row) and

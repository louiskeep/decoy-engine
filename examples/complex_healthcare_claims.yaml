# =============================================================================
# Decoy engine pipeline config — complex hand-authored example
#
# Scenario: a healthcare-claims warehouse. One parent (members) feeds three
# child tables via single-column AND composite FKs, plus a pure-generate
# audit_log table. Exercises namespaces (all four resolution paths), FPE,
# deterministic columns, coherent composites, from_parent FK wiring, the
# token vault, and the narrow transform surface.
#
# Validated by: PipelineConfig.model_validate(yaml).  extra="forbid" everywhere,
# so a typo'd key is a hard reject, not a silent pass-through.
# =============================================================================

version: 1

global_settings:
  # SECURITY: the seed is the master secret. Every FPE/derivation key is
  # derive(seed, namespace, label); leak it and every reversible column can be
  # un-masked by anyone holding this config. DO NOT commit a real seed.
  # The value below is a non-secret placeholder so the example validates and
  # runs deterministically in dev. In production, inject the seed out-of-band
  # at job time (the platform runner overlays global_settings before compile,
  # the same pattern as config._override.override_sources) — pulled from a
  # secrets manager (Vault / AWS / GCP), never from source control.
  seed: 0                     # placeholder — overridden per job; not a secret
  post_validation: true       # run post-mask invariant checks (FK joins, coherence)
  on_pool_exhaustion: fail     # pool-backed `unique` columns: fail rather than scale
  fidelity_warn_threshold: 0.85  # statistical generate columns warn below this score

# -----------------------------------------------------------------------------
# sources / targets: dicts KEYED BY TABLE NAME (profile/_source.py walks
# `sources.items()` as (table_name, descriptor)). Generate-kind tables
# (audit_log) intentionally have NO source entry.
# -----------------------------------------------------------------------------
sources:
  members:
    type: file
    format: csv
    path: ./in/members.csv
  enrollments:
    type: file
    format: parquet
    path: ./in/enrollments.parquet
  claims:
    # An S3 source. `credentials_ref` is OPAQUE to the engine — the platform
    # layer resolves it against its secrets store; the engine never sees a key.
    type: s3
    format: parquet
    bucket: acme-phi-landing
    key: warehouse/claims/2026-06.parquet
    region: us-east-1
    credentials_ref: phi-readonly
  providers:
    type: file
    format: csv
    path: ./in/providers.csv

targets:
  members:     { type: file, format: parquet, path: ./out/members.parquet }
  enrollments: { type: file, format: parquet, path: ./out/enrollments.parquet }
  claims:      { type: file, format: parquet, path: ./out/claims.parquet }
  providers:  { type: file, format: parquet, path: ./out/providers.parquet }
  audit_log:  { type: file, format: csv,     path: ./out/audit_log.csv }

# -----------------------------------------------------------------------------
# namespaces: explicit top-level declarations (resolution path #1).
# Two columns in the SAME namespace mask to the SAME value; different
# namespaces mask independently even if source values collide.
#
# Here we pin member_identity to the parent key explicitly. We DON'T have to
# repeat it on the child columns — the relationship below auto-inherits it
# (path #3). Composite keys are written "table.colA__colB".
# -----------------------------------------------------------------------------
namespaces:
  member_identity:
    declared_by:
      - members.member_id
  account_vault:
    declared_by:
      - members.legacy_account

tables:
  # ===========================================================================
  # PARENT: members
  # ===========================================================================
  - name: members
    transforms:
      # Narrow transform surface runs BEFORE the strategy loop. Drop test rows,
      # then derive a column the mask step can read.
      - op: filter
        expression: "status != 'TEST' and age >= 18"
      - op: derive
        column: full_name
        expression: "first_name + ' ' + last_name"
    columns:
      # --- FK parent key: FPE, reversible. namespace pinned above. ------------
      # FPE keeps format (9 digits in, 9 digits out) and is reversible from the
      # config alone via `decoy unmask` — so a vault here would be REJECTED
      # (vault_strategy_reversible). FPE columns MUST carry a namespace or
      # compile fails with fpe_requires_namespace (the key can't be derived).
      - name: member_id
        strategy: fpe
        namespace: member_identity
        provider_config:
          charset: digits          # 0-9, preserves a numeric ID
          preserve_separators: true

      # --- SSN: format-preserving, digits, separators (xxx-xx-xxxx) kept ------
      - name: ssn
        strategy: fpe
        namespace: ssn_space        # per-column namespace (resolution path #2);
                                     # need NOT appear in the namespaces: block
        provider_config:
          charset: digits
          preserve_separators: true

      # --- MRN: deterministic + alphanumeric FPE -----------------------------
      # `deterministic: true` is a HARD requirement for a namespace. Omit the
      # namespace here and compile dies with namespace_missing.
      - name: mrn
        strategy: fpe
        deterministic: true
        namespace: mrn_space
        provider_config:
          charset: alphanum         # lower + digits

      # --- Coherent composite #1: name + email stay row-consistent -----------
      # The group is {first_name, last_name, email}. ONE member declares the
      # namespace; the others inherit the whole-group binding. (If none
      # declared one, the engine would DERIVE `composite/members/email__first_name__last_name`.)
      - name: first_name
        strategy: replace_with_synthetic
        provider: person_name
        coherent_with: [last_name, email]
        namespace: member_pii        # explicit group namespace
      - name: last_name
        strategy: replace_with_synthetic
        provider: person_name
        coherent_with: [first_name, email]
      - name: email
        strategy: synthetic_email     # derives from the masked first.last
        coherent_with: [first_name, last_name]

      # --- Coherent composite #2: a valid US city/state/zip triple -----------
      # No member declares a namespace, so the engine DERIVES one:
      #   composite/members/city__state__zip   (resolution path #4 — the only
      #   place a namespace comes from the column names rather than a key).
      - name: city
        strategy: replace_with_synthetic
        provider: us_city
        coherent_with: [state, zip]
      - name: state
        strategy: replace_with_synthetic
        provider: us_state
        coherent_with: [city, zip]
      - name: zip
        strategy: fpe
        provider_config: { charset: digits }
        coherent_with: [city, state]

      # --- Vaulted one-way pseudonym -----------------------------------------
      # replace_with_synthetic is irreversible from config alone. vault: true
      # records the source->masked map into the encrypted vault so `decoy
      # unmask` can reverse it. Vault REQUIRES a namespace (it's the lookup
      # key (namespace, masked)) — declared in the namespaces: block above.
      - name: legacy_account
        strategy: replace_with_synthetic
        provider: account_number
        namespace: account_vault
        vault: true

  # ===========================================================================
  # enrollments: COMPOSITE FK child. (member_id, plan_id) references the
  # member's composite enrollment key. member_id inherits member_identity
  # from the relationship; plan_id is masked locally.
  # ===========================================================================
  - name: enrollments
    columns:
      - name: member_id
        strategy: from_parent        # value wired from the FK parent; the
                                     # relationship coordinator owns provider +
                                     # namespace, so we declare neither here.
      - name: plan_id
        strategy: fpe
        namespace: plan_space
        provider_config: { charset: ALPHANUM }
      - name: premium
        strategy: replace_with_synthetic
        provider: currency_amount
        cardinality_mode: match_source_cardinality

  # ===========================================================================
  # claims: single-column FK child on member_id.
  # ===========================================================================
  - name: claims
    transforms:
      - op: limit
        n: 5000000
    columns:
      - name: member_id
        strategy: from_parent
      - name: claim_id
        strategy: fpe
        namespace: claim_space
        provider_config: { charset: digits }
      - name: billed_amount
        strategy: replace_with_synthetic
        provider: currency_amount

  # ===========================================================================
  # providers: standalone table, PAN + NPI via FPE. PAN keeps the Luhn check
  # digit valid (validate_luhn recomputes it on encrypt AND decrypt).
  # ===========================================================================
  - name: providers
    columns:
      - name: npi
        strategy: fpe
        namespace: npi_space
        provider_config: { charset: digits }
      - name: pan
        strategy: fpe
        namespace: pan_space
        provider_config:
          charset: digits
          validate_luhn: true        # output passes Luhn; round-trip caveat noted
          preserve_separators: true
      - name: tax_id
        strategy: replace_with_synthetic
        provider: tax_id
        cardinality_mode: unique
        backend_type: pool
        pool_size: 250000            # capacity hint for the uniqueness pre-flight

  # ===========================================================================
  # audit_log: PURE GENERATE table (no source, no mask columns). Mask-XOR-
  # generate is enforced — declaring `columns` here too would be rejected.
  # ===========================================================================
  - name: audit_log
    row_count: 1000000
    generate_columns:
      - name: event_id
        type: sequence
        start: 1
        step: 1
      - name: actor
        type: faker
        faker_type: user_name
      - name: action
        type: categorical
        categories: [view, edit, export, delete]
      - name: risk_score
        type: formula
        formula: "1 if action == 'delete' else 0"
      # statistical: samples from a distribution snapshot, scored against
      # fidelity_warn_threshold above.
      - name: latency_ms
        type: statistical
        snapshot_file: ./snapshots/latency.dist.json

# -----------------------------------------------------------------------------
# relationships: FK edges. `orphan_policy` is REQUIRED (no default). A
# relationship that declares a `namespace` auto-binds BOTH parent and child
# columns to it (same-FK -> same-mask). An explicit override on a child that
# disagrees is rejected as namespace_ambiguity.
# -----------------------------------------------------------------------------
relationships:
  # Single-column FK: members.member_id <- claims.member_id.
  # namespace omitted here because members.member_id already owns
  # member_identity (declared in the namespaces: block); the child inherits it.
  - parent:   { table: members, columns: [member_id] }
    children:
      - { table: claims, columns: [member_id] }
    orphan_policy: fail

  # Composite FK: (member_id, plan_id) — the relationship DECLARES the
  # namespace, so both ends bind to it; member_id's existing member_identity
  # binding would conflict, so we name a fresh composite namespace instead.
  - parent:   { table: members, columns: [member_id, plan_id] }
    children:
      - { table: enrollments, columns: [member_id, plan_id] }
    orphan_policy: remap
    namespace: enrollment_key

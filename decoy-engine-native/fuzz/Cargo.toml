[package]
name = "decoy-engine-native-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
arrow-array = "59.2.0"
libfuzzer-sys = "0.4"

[dependencies.decoy-engine-native]
path = ".."
# The fuzz target links `_kernel::batch::derive_array` directly (no Python involved), so it
# must build without the `extension-module` feature: pyo3's own "extension-module" feature
# omits linking libpython, which a standalone libFuzzer binary does not provide.
default-features = false

[[bin]]
name = "derive_array"
path = "fuzz_targets/derive_array.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_metadata"
path = "fuzz_targets/ffi_metadata.rs"
test = false
doc = false
bench = false

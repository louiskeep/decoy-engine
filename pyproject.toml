# consultant-2026-07-09 F8: transforms.registry was removed by the S9.5
# V1 bulk-delete; override left dangling.

[tool.coverage.run]
source = ["src/decoy_engine"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Coverage is not gated as part of V2.0-prep. The configuration exists so
# `pytest --cov` produces useful output for V2.0-A's per-module unit-test
# work. A floor lands once V2.0-C closes and the test surface stabilizes.
fail_under = 0

[tool.mutmut]
# source_paths controls both what gets mutated AND what mutmut copies into
# mutants/ for the in-process test run (mutmut 3.x quirk: scoping this to a
# single file starves the copy, breaking imports of sibling package modules
# the covering tests' conftest transitively needs). Keep source_paths at the
# package root and use only_mutate to restrict actual mutation to the target.
source_paths = ["src/decoy_engine"]
only_mutate = ["src/decoy_engine/execution/_strategies/_redact.py"]
pytest_add_cli_args_test_selection = [
    "tests/unit/execution/test_redact_dtype_paths.py",
]
# NOTE: the execution SUBSTRATES (e.g. _planner.py) cannot be graded with this
# harness -- mutmut's in-process runner reports genuinely-surviving mutants as
# ⏰ timeout on their heavy pandas/pyarrow suites, and raising timeout_constant
# to 15.0 (a 225s per-mutant limit) did NOT change that, while a standalone
# `pytest` of the same activated mutant survives in ~3s. See tq-findings.md #8.
# debug = true  # flip on to see the raw pytest invocation/output when diagnosing.

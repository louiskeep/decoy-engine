[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# OSS.3 (2026-06-02) / Q-OSS-1 RESOLVED: distribution name stays
# `decoy-engine`. The CLI dist renamed to `decoy-cli`; the engine
# library dist did not.
name = "decoy-engine"
version = "0.5.0"
description = "Data masking and synthetic generation engine. Validates pipeline configs, compiles execution plans, runs masking + generate jobs against pandas / polars substrates. Used by the decoy-cli CLI and the decoy-platform commercial product."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "louiskeep" }]

# PyPI Trove classifiers. OS-independent; Python 3.10/3.11/3.12;
# topic taxonomy that library callers search for. Library-only
# (Environment :: Other Environment, not Console).
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

keywords = [
    "data-masking",
    "synthetic-data",
    "anonymization",
    "pii",
    "privacy",
    "data-generation",
    "faker",
    "mimesis",
    "pandas",
    "polars",
    "decoy",
]

dependencies = [
    # Upper bound tightened from <4 to <3: pandas 3.x resolves on Python
    # 3.11+ and produces fingerprint drift against the golden-suite (captured
    # under pandas 2.3.3 / Python 3.10), a determinism hazard caught by a
    # cross-process gold-suite re-run. Re-widen only alongside a golden
    # re-capture + a reviewed pandas-3 compatibility pass.
    "pandas>=1.5.0,<3",
    "pyyaml>=6.0",
    # Pinned exactly: Faker's name/data pools are not semver-stable, so the
    # version is part of the determinism guarantee (compatibility-contract
    # section 3.3) and the proof manifest. Bump only as a reviewed, golden-and-
    # manifest-regenerating change. Was an unpinned floor (>=13.0.0), which let
    # the proof-manifest drift across environments.
    # Held at 40.23.0: the dependabot bump to 40.31.0 (#47) skipped the
    # manifest-regen + review this pin requires, and 40.31.0 silently drops
    # five person providers (name/first/last/full/email) from the registry and
    # shifts the name pools the proof manifest is generated against. Migrating
    # to a newer Faker is a dedicated, provider-regression-fixing task on the
    # roadmap, not a chore bump.
    "faker==40.23.0",
    "psutil>=5.9.0",
    "pyarrow>=14.0.0",
    # Used by decoy_engine.disguises.schema for the Disguise model.
    # Was always required at runtime; was undeclared until benchmark CI
    # caught the gap on a fresh-environment install.
    "pydantic>=2.0",
    # Promoted from optional `[hybrid]` extras (Bug 1).
    # Phase 8 flipped `engine: hybrid` to the default, so a pandas-only
    # install would crash on first pipeline run with ModuleNotFoundError.
    # Both libs are now required to match the runtime contract.
    # Upper bound pinned in S11: Polars ships a major every ~6 months and the
    # expression surface evolves; the execution-substrate path is validated
    # against the 1.x I/O API, so cap below 2.0 until a 2.x validation pass.
    "polars>=1.0,<2.0",
    "duckdb>=0.10.0",
    # S14-CLOUD-SRC-S3GCS (2026-05-30): cloud sources are R1 marketed scope
    # (decoy_release_1_scope memory). boto3 was previously transitive via
    # moto[s3] in [dev] and platform-side; the engine's _load_s3_source +
    # platform's _fetch_s3_to_bytesio import it at function-call time, so
    # the production Compose image needs it declared. google-cloud-storage
    # ships alongside; the gcs extra below stays as a backwards-compat
    # marker. Dennis S14 gate B1 (2026-05-30): pyproject promote.
    "boto3>=1.26",
    "google-cloud-storage>=2.0",
    # QA Q16 (2026-05-30): execution/_transforms.py pins df.eval to engine=numexpr
    # so the Python-engine fallback (which can expose @var-based builtin escapes
    # for user-supplied filter / derive expressions) cannot trip silently.
    # numexpr is a hard runtime dependency, not optional.
    "numexpr>=2.8",
    # MG-3 / M2 (2026-05-31): the `nested` masking strategy walks each cell
    # as JSON and applies a child strategy to leaf values located by
    # JSONPath. jsonpath-ng (MIT) is the established, maintained
    # implementation; matches our posture for numexpr / polars (do not roll
    # our own parser). Required at import time of the nested strategy
    # module; absent imports fall back to a typed runtime error.
    "jsonpath-ng>=1.6",
    # SEC.1 / C1 (2026-06-03): user-supplied `formula` expressions evaluate
    # under simpleeval's restricted single-expression sandbox instead of
    # CPython eval() (which, even with empty __builtins__, was a known RCE via
    # ().__class__...__subclasses__). simpleeval (MIT) is the established,
    # maintained "safely evaluate one user expression" library; matches our
    # posture for numexpr / jsonpath-ng (do not roll our own AST sandbox).
    # Required at import time of decoy_engine.expressions.
    "simpleeval>=0.9.13",
    # SP-04 / P5.INFRA.1: check-digit validators for luhn, iban, ean, isbn,
    # and gtin (python-stdnum); npi and vin are hand-rolled (not in stdnum).
    # Core dep (not optional): the checksum: fpe param is engine functionality
    # used by the HIPAA pack NPI columns and the P&C pack VIN columns.
    # The CI no-extras job installs .[dev] only, so this must live here.
    "python-stdnum>=2.2",
    # SP-06 / P5.INFRA.2: closed-vocabulary expression parser for
    # derived/case_when strategies. lark (MIT) is the established EBNF
    # parser generator; parses config-supplied expressions against a
    # closed grammar so arbitrary Python execution is impossible.
    # Core dep: derived/case_when are core strategies, not optional.
    "lark>=1.1",
    # DPS Scope B (2026-07-22): OpenDP supplies every per-column DP mechanism
    # and its certified privacy map; exact pin because the implementation
    # depends on privacy-critical `contrib`-gated APIs (make_find_bin,
    # make_count_by, then_laplace_threshold) and their exact metric/domain
    # shapes. MIT license, compatible with Apache-2.0. Upgrade only through a
    # dependency review with mechanism regression tests (guide section 3.1).
    # STOP: never install the `opendp[polars]` extra or import
    # `opendp.extras.polars` -- it FFI-pins polars==1.36.1, which conflicts
    # with Decoy's polars>=1,<2 range (2026-07-22 spike, docs/plans/
    # 2026-07-22-dps-scope-b-spike-result.md). This build has no Polars
    # dependency of its own.
    "opendp==0.15.1",
    # Google's standalone, pure-Python privacy accountant (Apache-2.0, no
    # native build step). Composes each OpenDP-certified per-column
    # (epsilon, delta) into one fit-wide privacy-loss-distribution total via
    # `dp_accounting.pld`'s dominating-pair construction. Exact pin: the
    # implementation depends on `dp_accounting.pld`'s exact composition
    # shape. Supplies no mechanism and no noise -- accounting only.
    "dp-accounting==0.6.0",
    # DPS-CODEC put `packaging.utils.canonicalize_name` /
    # `packaging.markers.Marker` on the always-imported plan chain
    # (quality/dp_provenance, reached via plan._checks_dp at engine import),
    # so `import decoy_engine` now needs packaging at runtime. It was present
    # transitively via build/test tooling, so every test env had it and the
    # gap only shows on a pristine install -- same fresh-environment class as
    # the pydantic and boto3 promotions above. Floor covers canonicalize_name
    # and Marker, both long-stable.
    "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # moto is used by S3 connector contract tests (Week 2 of Sprint G).
    # Pinned here so a fresh `pip install -e .[dev]` brings it along
    # rather than failing on the first import in test collection.
    "moto[s3]>=5.0",
    # The property suite (tests/property/test_mask_invariants.py, audit
    # remediation 2026-06-12) is part of the default test run; without
    # this pin CI fails at collection with ModuleNotFoundError.
    "hypothesis>=6.0",
    # Test-Quality Program (TQ-0, 2026-07-25): coverage measurement + mutation
    # grading. pytest-cov feeds the TQ-3 diff-coverage ratchet; mutmut grades
    # whether tests catch planted bugs (the objective "adequately tested" bar).
    "pytest-cov>=5.0",
    "mutmut>=3.0",
]
# Linters are exact-pinned, not floored. ruff and mypy both ship new
# rules / error categories in minor releases that turn previously-green
# code red with no code change. CI (.github/workflows/ci.yml) installs
# these same versions; bump them deliberately alongside a lint pass.
lint = [
    "ruff==0.15.22",
    "mypy==2.3.0",
]
# engine-v2 S7: Mimesis is an OPTIONAL alternative provider backend. The
# default install does NOT pull it; MimesisAdapter imports behind a
# try/except and the default registry stays Faker/DecoyNative-only unless
# `mimesis` is installed AND a provider is in the adoption matrix.
# Upper bound: the adoption matrix was evaluated against 19.x (2026-06-12);
# a major bump re-runs the parity evaluation before widening.
mimesis = [
    "mimesis>=19.0,<20",
]
# Capability-gaps WS2 (2026-06-12): spaCy NER backs text_redact's
# person_name/location span detection (opt-in `ner` config key). The
# language model is NOT pip-resolvable; install it separately:
# `python -m spacy download en_core_web_sm`.
ner = [
    "spacy>=3.7,<4",
]
# Deferred follow-up 1 (2026-06-12): the token vault encrypts its
# source->masked map with Fernet (AES-128-CBC + HMAC-SHA256) from the
# audited `cryptography` package. Optional: the default install stays
# compiled-dep-free; vault.py imports it function-locally and raises
# vault_crypto_not_installed naming this extra when absent. No upper
# bound: the Fernet API is stable and capping a crypto dependency pins
# users to stale security fixes.
vault = [
    "cryptography>=42",
]
# Sphinx + sphinx-autoapi build the API reference site published to
# GitHub Pages. Build from the repo root via `pip install -e .[docs]`
# then `make -C docs html`. CI lives at `.github/workflows/docs.yml`.
# Item 50 Phase E in the cross-repo plan.
docs = [
    "sphinx>=7,<9",
    "sphinx-autoapi>=3,<4",
    "furo>=2024.1",
    "myst-parser>=2,<5",
    "sphinx-copybutton>=0.5",
    "linkify-it-py>=2",
    # Renders ```mermaid fenced blocks in docs/architecture.md. Without this
    # Pygments treats `mermaid` as an unknown lexer and -W fails the build.
    "sphinxcontrib-mermaid>=0.9",
]
# First-party cloud-storage connector extras. S14-CLOUD-SRC-S3GCS
# promoted boto3 + google-cloud-storage to [project] dependencies (above)
# because R1 marketed scope includes cloud object storage and the
# extras-only model broke the production Compose image (Dennis S14 gate
# B1). The `gcs` extra below is now a no-op backwards-compat marker
# (already pulled by the base install); kept so existing `pip install -e .[gcs]`
# invocations still work. SFTP remains an opt-in extra pending S18.
gcs = []
sftp = ["paramiko>=3.0"]
# SP-08b (2026-06-28): H3 geospatial indexing for lat/lng generalization.
# h3-py (Uber, Apache-2.0) is optional: the base install stays free of the
# C extension. geo_generalize with type=lat_lng fails closed (ImportError)
# when h3 is absent and names this extra in the error message.
# Upper bound: h3 4.x is the stable API; cap below 5 until a 5.x validation pass.
geo = [
    "h3>=4.0,<5",
]
# ML field-recognition harness extras. scikit-learn backs the held-out
# split scaffolding (StratifiedGroupKFold, §A.3 leakage guard) and
# calibration utilities (CalibratedClassifierCV, §A.4). LightGBM is the
# optional gradient-boosted classifier (ML2.2). Not required for the regex
# baseline (which has no training phase). Upper bound: 2.x changes the
# GroupKFold API; pin below 3 until a 3.x validation pass.
# lightgbm upper bound: 4.x is the stable API; cap below 5 until a 5.x
# validation pass.
#
# Versions are EXACT-pinned, not ranged. The frozen golden pack
# (docs/v2/ml/packs/lgbm-v1) and its retrain gate
# (tests/snapshots/test_ml_lightgbm_golden.py::test_lightgbm_regression_retrain)
# assert reproduced metrics within 1e-4 of the committed baseline. Tree-split
# tie-breaking and calibration drift across even a scikit-learn patch release
# can exceed that tolerance, so a floating range would make the CI gate
# non-reproducible over time. These are the versions the shipped pack was
# trained under (Python 3.10, the public floor). Bump deliberately: change the
# pin and regenerate the golden in the same PR
# (UPDATE_SNAPSHOTS=1 pytest tests/snapshots/test_ml_lightgbm_golden.py),
# never implicitly.
#
# Cost acknowledged: this makes `[ml]` a HERMETIC extra. A downstream install
# of decoy-engine[ml] alongside a package needing a different scikit-learn/
# lightgbm gets an unsatisfiable or force-downgraded resolution, and a security
# patch (e.g. a scikit-learn 1.7.3 CVE fix) cannot be adopted without the
# deliberate bump-and-regenerate above. That trade is accepted for a
# reproducible shipped model pack (same posture as the exact faker pin in the
# core deps); the numeric stack under sklearn (numpy/scipy) is intentionally
# left unpinned -- LightGBM training is pinned deterministic
# (n_jobs=1 + deterministic=True + force_row_wise=True in trainer.py), and the
# first ubuntu-latest ml-gate run is the reproducibility proof of record.
ml = [
    "scikit-learn==1.7.2",
    "lightgbm==4.6.0",
]
# CI/perf-tooling: CodSpeed instrumented microbenchmarks (tests/codspeed/).
# Optional: the `codspeed` pytest marker keeps that suite out of the default
# loop (see addopts above) precisely so most contributors never need this
# installed. With the extra present, `pytest tests/codspeed/ -m codspeed`
# runs the suite as ordinary timed tests; the CodSpeed GH Action additionally
# passes `--codspeed` to capture instrumented measurements and upload them.
perf = [
    "pytest-codspeed>=3.0",
]

# Project URLs surfaced on the PyPI sidebar.
[project.urls]
Homepage = "https://github.com/louiskeep/decoy-engine"
Repository = "https://github.com/louiskeep/decoy-engine"
Documentation = "https://github.com/louiskeep/decoy-engine/blob/main/README.md"
Issues = "https://github.com/louiskeep/decoy-engine/issues"
Changelog = "https://github.com/louiskeep/decoy-engine/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/decoy_engine"]

# DE-07: the shipped ML model pack is the source-of-truth under docs/ (so the
# golden gate + provenance tests pin exactly those bytes), which is OUTSIDE the
# packaged src/decoy_engine tree. Without this a clean wheel omitted the pack
# and classify_fields silently returned None in a real install. Force-include
# copies the pack under the installed package at decoy_engine/model_packs/, and
# classify._default_pack_dir() resolves it via importlib.resources. py.typed
# ships automatically (it lives under the packaged src/decoy_engine tree).
[tool.hatch.build.targets.wheel.force-include]
"docs/v2/ml/packs/lgbm-v1" = "decoy_engine/model_packs/lgbm-v1"

# The sdist ships docs/v2/ml/packs/lgbm-v1 at its natural path (the bytes are
# VCS-tracked), so a wheel built FROM the sdist (the PyPI path) still finds the
# force-include source. Do NOT relocate the pack in the sdist -- that would move
# it out from under the wheel force-include and break sdist->wheel builds.
[tool.hatch.build.targets.sdist]
# Keep hatchling's default file selection, but never ship dev scratch: agent
# worktrees under .claude/ carry full nested-repo snapshots (duplicate docs +
# model packs) and .hypothesis is the property-test DB, so a `python -m build`
# from a dirty dev checkout would otherwise upload them to PyPI. These dirs are
# also VCS-ignored (the root-cause fix); this exclude is belt-and-suspenders and
# also drops the few tracked .claude/ dev-tooling files, which a source dist
# does not need.
exclude = [".claude", ".hypothesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "scripts" makes scripts/codeset_etl importable as a top-level package
# from tests (HC-1 slice 2) without a sys.path hack in the test module
# itself; scripts/ is never packaged into the wheel (see
# [tool.hatch.build.targets.wheel] above), so this is test-only reach, not
# a new runtime import surface.
pythonpath = ["src", "scripts"]
# addopts: belt-and-suspenders exclusion for the test-flight suite (primary
# exclusion is the testflight/ location outside testpaths). The CLI -m flag
# overrides addopts -m, so addopts alone is not sufficient -- but together
# with the path exclusion it closes all default-loop collection vectors.
# `packaging` is ALSO excluded here (unlike `ml`, which merely importorskips):
# a packaging test shells out to a full isolated wheel/sdist build, so it must
# never fire in the default loop even if the `build` frontend becomes
# importable in a dev venv. It runs only via the packaging-gate CI job's
# explicit `pytest -m packaging`.
# The `perf` marker is intentionally NOT excluded: perf tests run in the
# default regression gate (see the perf marker description below).
# `codspeed` is excluded for the same reason as `benchmark`: tests/codspeed/
# uses the pytest-codspeed `benchmark` fixture, which only exists when the
# optional `perf` extra is installed. Deselecting via marker (rather than
# relying on an importorskip) means the fixture is never resolved in an
# environment that lacks the plugin, so the default gate cannot fail on a
# missing optional dependency. Run explicitly via the codspeed workflow
# (`pytest tests/codspeed/ -m codspeed`), matching the ml-gate / packaging-gate
# explicit `-m` override pattern below.
addopts = "-m 'not benchmark and not testflight and not packaging and not codspeed'"
markers = [
    "benchmark: informational performance benchmarks; not a regression gate",
    "codspeed: pytest-codspeed instrumented microbenchmarks (tests/codspeed/); needs the [perf] extra; run only by the codspeed CI workflow, gated on the CODSPEED_TOKEN secret",
    "perf: PERF.BASE.2/3 fixture + baseline tests; run in the default regression gate (not opt-in)",
    "golden: engine-v2 S1 golden fixture suite (CSVs + manifests under tests/fixtures/golden/); CI gates engine-v2 sprint work on these",
    "regression: a bugfix's regression test; the prove-regression gate re-runs it against the pre-fix baseline and requires it to fail there",
    "testflight: acceptance test-flight suite (deliberately run, multi-job); excluded from the default loop; invoke via pytest testflight -m testflight or python scripts/test_flight.py",
    "ml: STORM field-recognition ML tests needing the [ml] extra (scikit-learn + lightgbm). Run by the ml-gate CI job (pytest -m ml with .[dev,ml] installed); they importorskip in the default gate where the extra is absent. Mark a new ML test module by adding pytestmark = pytest.mark.ml at module top so coverage stays automatic rather than a hand-maintained path list.",
    "packaging: build-artifact tests that shell out to the wheel build frontend (DE-07 wheel-membership gate). Run by the packaging-gate CI job (pytest -m packaging with `build` installed); importorskip out of the default loop where `build` is absent.",
    "dp_certified: requires the certified DP proof-stack (fit_dp_snapshot only completes in the 77-dist dev+lint+vault 3.10.20 profile); tests/conftest.py's pytest_collection_modifyitems skips these off that profile. Run by the dp-certified-gate CI job.",
]

# ── Tooling baseline (V2.0-prep, sprint 1) ──────────────────────────────────
# Lint + type-check + format gate land before any structural V2 refactor so
# decomposition PRs run against the gate from day 1. Mypy starts at
# check_untyped_defs and escalates per-subpackage as touched (resolved
# question #2). See decoy-platform docs/audit/from-engine/v2-app-audit-findings-2026-06-02.md F-AUDIT for related items (moved out of this repo 2026-06-02).

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = [".pytest_cache", "__pycache__", "logs", "mappings", "docs/_build"]

[tool.ruff.lint]
# Pragmatic selection. E501 (line length) is owned by ruff format so it
# stays out. S-rule false-positives in tests are handled via per-file
# ignores below. UP rules drive the gradual move to PEP 585 / 604.
select = ["E", "F", "I", "B", "SIM", "UP", "N", "PT", "S", "RUF"]
ignore = [
    "E501",   # line-too-long: handled by ruff format
    "S311",   # non-crypto random: legit in Faker seeding and generators
    "S608",   # hardcoded SQL: source.db ops build SQL on purpose; documented power-user surface
    "S110",   # try-except-pass: telemetry paths intentionally swallow
    "S112",   # try-except-continue: telemetry paths intentionally swallow
    "N806",   # non-lowercase var: math notation in stats/crypto modules
    "N803",   # non-lowercase arg: same reason
    "SIM105", # contextlib.suppress: marginal readability win; not worth churn
    "SIM102", # nested-if-collapse: sometimes clearer split
    "SIM108", # ternary-instead-of-if: ternaries are often less readable
    "E731",   # lambda assignment: occasional in callback wiring
    "B904",   # raise-without-from: cosmetic; high-volume; cleanup as touched
    "RUF012", # mutable-class-default: false positives on dataclass-like defaults
    # RUF002 / RUF003 (ambiguous unicode in docstrings / comments) are NOT
    # globally ignored: the no-em-dash repo rule extends to en-dash + smart
    # quotes, and the lint catches drift before it lands. The two intentional
    # math-notation callsites (× in fpe.py docstring + a test comment) carry
    # narrow per-file ignores below.
    "RUF013", # implicit-Optional: cleanup as touched; high-volume
]
[tool.ruff.lint.per-file-ignores]
# Tests can use assert (S101) and have lower naming bars. Additional
# test-only suppressions cover cosmetic pytest-style nits (PT018
# assertion-too-complex, PT006 parametrize tuple-vs-list, PT012/PT019
# fixture/raises body shape) and patterns legitimate in tests but
# loud under the broader src ratchet (S108 /tmp paths, SLF001 private
# member access in white-box tests).
#
# B017 (assert-raises-exception): white-box tests deliberately assert on a
#   broad Exception when the point is "the guard rejects", not which subclass.
# RUF043 (raises-ambiguous-pattern): pytest.raises(match=...) takes a regex;
#   the substring patterns used here are intentional and read fine unescaped.
# RUF059 (unpacked-variable-unused): tests often unpack a full API tuple
#   (e.g. compile_expr, evaluate = _get_parser()) to show the full surface even
#   when only one function is exercised in that test case.
# SIM117 (multiple-with): nested context managers are sometimes clearer in
#   arrange blocks; not worth churn in tests.
"tests/**" = [
    "S101", "S105", "S106", "S108",
    "N802", "N803", "N806",
    "PT011", "PT017", "PT018", "PT006", "PT012", "PT019",
    "SLF001",
    "B017", "RUF043", "RUF059", "SIM117",
]
# Connector contract tests intentionally use insecure hashing.
"tests/connectors/**" = ["S101", "S105", "S106", "S324"]
# Test-flight suite (lives outside tests/ for path-based exclusion from the
# default loop). Apply the same relaxed rules as tests/** so assert statements,
# pytest parametrize style, and lower naming bars do not false-positive.
"testflight/**" = [
    "S101", "S105", "S106", "S108",
    "N802", "N803", "N806",
    "PT011", "PT017", "PT018", "PT006", "PT012", "PT019",
    "SLF001",
    "B017", "RUF043", "RUF059", "SIM117",
]
# scripts/test_flight.py: confirmed-importable stub; run_suite import is
# intentionally present to prove the runner package is importable.
"scripts/test_flight.py" = ["F401"]
# TB-3 cgroup validation: a manual/gated harness whose whole job is spawning
# capped `sudo systemd-run` children (S603/S607 subprocess with a partial
# path are intentional and the command is fully code-constructed) and reading
# fixtures/reports from a /tmp scratch tree (S108).
"scripts/tb3_cgroup_validation.py" = ["S603", "S607", "S108"]
# TB-4 k-calibration: a manual/gated measurement harness that asserts on its
# own measured invariants (S101) and stages fixtures in a /tmp scratch tree
# (S108); neither is a production code path.
"scripts/tb4_calibration.py" = ["S101", "S108"]
# Benchmark suite has measurement loops that look stylistically loud.
"tests/benchmark/**" = ["S101", "S105", "S106", "N802", "N806", "PT011"]
# Intentional design / math-notation exceptions (no removal trigger;
# the carve-out itself is the right behaviour):
# × (multiplication sign) is intentional math notation in the FPE
# docstring. Narrow to RUF002 so any other ambiguous-unicode
# regression still trips CI.
"src/decoy_engine/transforms/fpe.py" = ["RUF002"]
# Same character in a test comment ("2 cities × 2 statuses = 4 buckets")
# explaining a balanced-categoricals fixture; ASCII would obscure the
# product semantics.
"tests/unit/test_storm_reid_risk.py" = ["RUF003"]
# Empty-hook base classes intentionally swallow their body for
# subclasses to override.
"src/decoy_engine/internal/base.py" = ["B027"]
# Late-import-to-break-cycle pattern, documented in the module header.
"src/decoy_engine/internal/validator.py" = ["E402"]
"src/decoy_engine/sdk.py" = ["E402"]
# Imports sit next to the thematically-grouped sections they serve (name-hint
# loader by the _NAME_HINTS table; contextvars by the per-scan extras layer;
# dataclass by the Span/iter_spans block), each with its own explanatory
# header. Deliberate narrative layout, not a top-of-file omission.
"src/decoy_engine/storm/detectors.py" = ["E402"]


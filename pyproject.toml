    # storm.model_pack.trainer (ml extra only).
    "lightgbm",
    "lightgbm.*",
    # python-stdnum ships no py.typed marker / stub package.
    # SP-04 / P5.INFRA.1: added as a core dep; ignore_missing_imports
    # keeps mypy green without losing the import-time catch for everything
    # else. Per the established convention (same pattern as duckdb, faker,
    # polars, etc. above).
    "stdnum",
    "stdnum.*",

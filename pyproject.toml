# ---------------------------------------------------------------------------
# Bounded shrink-only allowlist for pre-V2 type debt.
#
# Replaces an earlier blanket `ignore_errors = true` per module, which let
# arbitrary new error categories slip in silently. Now each legacy module
# enumerates the specific error codes that fire today; any code that is
# NOT on the list still trips CI for that module. Removing a code from a
# list is allowed (it tightens the gate); adding one requires a comment
# explaining the new debt category and which sprint will close it.
#
# Each module is also tagged with its scheduled deletion or refactor
# sprint per the V2 sprint plan; V2.1 entries vanish with the files,
# V2.0-B/C entries shrink as those sprints land.
# ---------------------------------------------------------------------------

# consultant-2026-07-09 F8: masker.masker and generators.{generator,
# relationships} were removed by the S9.5 V1 bulk-delete; their overrides
# below were left dangling (a dangling override resolves silently under
# mypy). See docs/engine-consultant-findings-2026-07-09.md.

# generators.columns — V2.1 hard delete. `index` debt surfaced by
# V2.0-C tightening deterministic_hash to return str | None; the
# callsite filters nulls upstream so the slice is safe. `arg-type`:
# year-bin parsing calls int()/float() on config dict values typed
# Any | None and catches the TypeError on None deliberately; the guard
# is the runtime contract, not a type to refine in a doomed module.
[[tool.mypy.overrides]]
module = ["decoy_engine.generators.columns"]
disable_error_code = ["index", "arg-type"]

# generators._distribution / generators._formula — V2.1 hard delete
# (mixin helpers split out of columns.py to stay under the size cap).
# Both mixins reference attributes (logger, _column_ctx, faker,
# _reference_date) that are provided by ColumnGenerator at runtime;
# mypy cannot verify the mixin-host contract without abstract Protocol
# declarations, which are not worth adding to modules slated for
# deletion. `arg-type` in _distribution: int() called on Any|None dict
# value inside a try/except (TypeError, ValueError) guard; the guard IS
# the contract here, same pattern as generators.columns.
[[tool.mypy.overrides]]
module = ["decoy_engine.generators._distribution"]
disable_error_code = ["attr-defined", "arg-type"]

[[tool.mypy.overrides]]
module = ["decoy_engine.generators._formula"]
disable_error_code = ["attr-defined", "index"]

# consultant-2026-07-09 F8: transforms.{hash,categorical,faker_based}
# were removed by the S9.5 V1 bulk-delete; overrides left dangling.

# internal.* type-debt allowlist. V2.0-C split internal/helpers.py into
# crypto/fs/faker_setup (now strict-gated). What remains in internal/
# is the V1 legacy stack that V2.1 hard-deletes.

# V1 legacy IOHandler base class. V2.1 delete with the Masker stack.
[[tool.mypy.overrides]]
module = ["decoy_engine.internal.base"]
disable_error_code = ["import-untyped"]

# consultant-2026-07-09 F8: internal.large_file_processor was removed by
# the S9.5 V1 bulk-delete; override left dangling.

# V1 legacy logging wrapper. V2.0-D / V2.1 audits replacement with the
# context.Logger Protocol everywhere.
[[tool.mypy.overrides]]
module = ["decoy_engine.internal.logging"]
disable_error_code = ["assignment"]

# consultant-2026-07-09 F8: internal.validator (V1 MaskerConfigValidator +
# GeneratorConfigValidator; its replacement was decoy_engine.graph.validators,
# which the F8 mypy-override cleanup above also removed as dangling, the
# whole V1 validator generation is gone) was removed by the S9.5 V1
# bulk-delete; override left dangling.

# connectors.* — V1.5 DB-connector cleanup + V2.0-C boundary; for now
# every connector enumerates its own debt categories independently so the
# V1.5 sweep can shrink each list one connector at a time.
[[tool.mypy.overrides]]
module = ["decoy_engine.connectors"]
disable_error_code = ["misc"]

# consultant-2026-07-09 F8: connectors.{csv_connector,database,factory,
# fixed_width} were removed by the S9.5 V1 bulk-delete; overrides left
# dangling. connectors.{gcs,s3,sftp} below are current and stay.

[[tool.mypy.overrides]]
module = ["decoy_engine.connectors.gcs"]
disable_error_code = ["attr-defined", "import-untyped"]

[[tool.mypy.overrides]]
module = ["decoy_engine.connectors.s3"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]

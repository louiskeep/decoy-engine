# Methodology citation registry
#
# Modules implementing established-methodology primitives. Each entry
# MUST have a `Pattern:` line in its module docstring matching the
# `pattern` field here. The sentry test at
# tests/sentry/test_methodology_citations.py enforces presence.
#
# Adding a module: register it here AND add the `Pattern:` line to the
# module docstring in the same PR. Removing a module: delete the
# entry here AND scrub the docstring marker (or leave a regular
# docstring without the marker).
#
# Per the V2 sprint plan (Engineering Best Practices §6.1):
#   "If a module is in the registry, it has a citation; if it has a
#    citation, it is in the registry. No third state."
#
# Format conventions for the docstring line:
#   "Pattern: <name> (<source>, <license>). See: <link>."
# Multi-line additions (design notes, deferral rationale) follow.

modules:
  # S22-CL-V1GRAPHRUNNER (2026-05-30): removed transforms/hash.py +
  # transforms/faker_based.py + transforms/format_preservation.py from
  # the registry. Those V1 transform modules were deleted alongside the
  # V1 graph runner. The V2 strategy handlers in
  # execution/_strategies/_hash.py + _faker.py implement the same
  # patterns (HMAC-SHA256 + HKDF + Faker seeded) directly; their
  # docstrings cite the patterns. Adding registry entries for the V2
  # strategy modules is V2.1 follow-up.

  - path: src/decoy_engine/transforms/fpe.py
    pattern: Type-II Feistel + HMAC-SHA256
    source: Feistel 1973; HMAC RFC 2104

  - path: src/decoy_engine/checksums.py
    pattern: Check-digit validation (python-stdnum + NPPES + ISO 3779)
    source: python-stdnum (LGPL); CMS NPPES NPI Check Digit Procedure; ISO 3779 / NHTSA 49 CFR 565

  - path: src/decoy_engine/transforms/date_shift.py
    pattern: HMAC-SHA256-keyed deterministic offset
    source: HMAC RFC 2104

  - path: src/decoy_engine/storm/model_pack/provenance.py
    pattern: HMAC-SHA256
    source: RFC 2104
    note: Manifest integrity signing for ML model packs (ML3.2). Same stdlib
      keyed-hash primitive as transforms/fpe.py and determinism/_hkdf.py.

  # SP-05 (2026-06-27): FK-integrity validators use the SDV HMA1 parent-first
  # DAG pattern: materialise parent PK set, resolve child FK values against it.
  - path: src/decoy_engine/validators/_fk_validators.py
    pattern: SDV HMA1
    source: sdv-dev/SDV (MIT); HierarchicalMetaData model (HMA1)

  # SP-06 / P5.INFRA.2 (2026-06-27): closed-vocabulary expression parser.
  # Lark EBNF grammar closes the arbitrary-code-execution surface that
  # eval()-based parsers expose. The grammar IS the boundary.
  - path: src/decoy_engine/expressions/_lark_parser.py
    pattern: Lark EBNF parser generator
    source: lark-parser/lark (MIT)

  # SP-06 / P5.INFRA.3 (2026-06-27): reference table loader.
  # pyarrow Parquet I/O is the established in-process columnar format;
  # HMAC-SHA256 keyed row derivation reuses internal.crypto.hmac_hex.
  - path: src/decoy_engine/reference_tables/_loader.py
    pattern: pyarrow Parquet I/O
    source: apache/arrow (Apache-2.0)

  # SP-07 / P5.S.text_mask (2026-06-28): span-level PII masking.
  # HMAC-SHA256 keyed per-span determinism (same real value in any cell
  # always produces the same masked value). Reuses fpe_encrypt_value
  # (Feistel+HMAC) and storm.detectors.iter_spans (single source of truth).
  - path: src/decoy_engine/transforms/text_mask.py
    pattern: HMAC-SHA256 keyed span determinism
    source: RFC 2104 (HMAC); Type-II Feistel 1973 (via fpe.py)

  # SP-08 (2026-06-28): joint_mask compound reference-tuple masking.
  # HMAC-SHA256-keyed row selection via ReferenceTable.keyed_row (RFC 2104).
  # Reuses SP-06 reference_tables loader (pyarrow Parquet I/O).
  - path: src/decoy_engine/transforms/joint_mask.py
    pattern: HMAC-SHA256-keyed row derivation via ReferenceTable.keyed_row
    source: RFC 2104 (HMAC); apache/arrow (Apache-2.0)

  # SP-08 (2026-06-28): geo_generalize ZIP Safe Harbor cascade.
  # HIPAA Safe Harbor restricted-ZIP3 list per 45 CFR 164.514(b)(2)(i)(B).
  - path: src/decoy_engine/transforms/geo_generalize.py
    pattern: HIPAA Safe Harbor ZIP cascade
    source: 45 CFR 164.514(b)(2) HHS HIPAA Privacy Rule

  # SP-10 (2026-06-28): derived column-level strategy.
  # Reuses the SP-06 Lark closed-grammar parser (compile_expr/evaluate)
  # for row-context expression evaluation. The closed grammar is the
  # security boundary; no eval() or exec() is used.
  - path: src/decoy_engine/transforms/derived.py
    pattern: Lark EBNF closed-grammar expression evaluation
    source: lark-parser/lark (MIT)

  # SP-10b (2026-06-28): derived_aggregate intra-table scalar aggregate.
  # Aggregate semantics follow the SQL standard (ISO/IEC 9075-1, clause on
  # set functions). Null handling follows the SQL rule (NULLs excluded).
  # pandas Series.sum / .mean / .min / .max / .count with skipna=True.
  - path: src/decoy_engine/transforms/derived_aggregate.py
    pattern: SQL aggregate functions (SUM/AVG/MIN/MAX/COUNT) with pandas Series
    source: ISO/IEC 9075-1 (SQL); pandas 2.x (Apache-2.0; https://pandas.pydata.org/docs)

  # SP-08b (2026-06-28): H3 geospatial lat/lng generalization.
  # h3-py (Uber, Apache-2.0) encodes lat/lng pairs into H3 hexagonal cell
  # indexes at configurable resolutions (9=~150m, 7=~1km, 5=~9km).
  # Same k-threshold cascade pattern as the ZIP Safe Harbor cascade above.
  - path: src/decoy_engine/transforms/geo_generalize.py
    pattern: H3 geospatial indexing
    source: h3-py (Uber, Apache-2.0); https://h3geo.org/

  # SP-08b (2026-06-28): bucket_perturb datetime strategy.
  # ISO 8601 calendar period partitioning (week/month/quarter) with
  # deterministic per-value position derived from derive(job_seed, ns, value).
  # Follows the k-anonymity temporal generalization principle (Sweeney 2002).
  - path: src/decoy_engine/transforms/bucket_perturb.py
    pattern: ISO 8601 calendar period partitioning
    source: ISO 8601 (https://www.iso.org/iso-8601-date-and-time-format.html); Sweeney 2002 k-anonymity

  # SP-10c (2026-06-29): group_key per-group identifier.
  # HKDF-SHA256 + HMAC-SHA256 keyed derivation via derive() with a per-column
  # namespace "group_key/<col>". Same hash-for-joinability primitive used
  # throughout the engine; isolates each group_key column's output space.
  - path: src/decoy_engine/transforms/group_key.py
    pattern: HKDF-SHA256 + HMAC-SHA256 keyed derivation
    source: RFC 5869 (HKDF); RFC 2104 (HMAC)

  # SP-10c (2026-06-29): windowed_date bounded date offset.
  # Per-row seeds come from derive(seed, "windowed_date/<col>", row_index)
  # (HKDF-SHA256 + HMAC-SHA256) so two windowed_date columns produce
  # independent offset streams. Date arithmetic via pandas Timestamp +
  # Timedelta; offset sampling via numpy.random.default_rng.
  - path: src/decoy_engine/transforms/windowed_date.py
    pattern: derive()-per-column namespace + bounded date offset
    source: RFC 5869 (HKDF); RFC 2104 (HMAC); pandas 2.x (Apache-2.0)

  # SP-10c (2026-06-29): grouped_series cumcount + derive()-seeded monotone walk.
  # cumcount positions follow pandas GroupBy.cumcount() (SDV per-group
  # sequencing). monotone_walk per-group RNG seeds come from derive(seed,
  # "grouped_series/<col>", group_label) so two monotone_walk columns
  # produce independent walks.
  - path: src/decoy_engine/transforms/grouped_series.py
    pattern: pandas groupby cumcount + derive()-seeded monotone walk
    source: pandas 2.x (Apache-2.0); SDV (MIT); RFC 5869 (HKDF); RFC 2104 (HMAC)

  # Sprint G (2026-07-03): SS3 closure engine, the novel core of FK-aware
  # subsetting. Downward+upward fixpoint over the declared relationships
  # graph; termination is a monotonicity argument, not a graph-acyclicity
  # one, so cyclic FK schemas terminate the same way acyclic ones do.
  - path: src/decoy_engine/subset/_closure.py
    pattern: Semi-naive Datalog fixpoint evaluation
    source: Ullman, "Principles of Database and Knowledge-Base Systems" ch. 3
      (Kleene / Knaster-Tarski monotone fixpoint)

  # Sprint G (2026-07-03): SS2 deterministic seed sampling. HMAC-SHA256-keyed
  # bottom-k selection chosen over pl.DataFrame.sample(seed=...) specifically
  # for cross-polars-version determinism (see the module docstring).
  - path: src/decoy_engine/subset/_seed.py
    pattern: Bottom-k / KMV consistent sampling
    source: RFC 2104 (HMAC); MinHash bottom-k sketch family

  # Removed 2026-06-02: the entire `forecast/` module (Recommender +
  # ForecastReport + DisguiseRecommendation + FieldRecommendation +
  # RiskFlag) was deleted under the storm-reframe-C clean break
  # (2026-05-31). The directory survives as an empty shell with stale
  # __pycache__/; the registry entry was orphaned and tripped the
  # sentry test. Removing both the registry entry AND the empty
  # directory ends the drift.

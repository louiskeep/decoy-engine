# CPNI (Customer Proprietary Network Information) Telecom Pack (SP-12).
#
# Regulatory basis:
#   47 CFR Part 64, Subpart U -- Customer Proprietary Network Information.
#   Implementing 47 U.S.C. 222 (Telecommunications Act of 1996, Section 222).
#   FCC rules prohibit telecommunications carriers from disclosing CPNI
#   without express customer consent. CPNI is defined as:
#     (a) information that relates to the quantity, technical configuration,
#         type, destination, location, and amount of use of a telecom service;
#     (b) information contained in the bills related to that service;
#     (c) information made available to the carrier by the customer solely
#         by virtue of the carrier-customer relationship.
#   Reference: 47 CFR 64.2003 (definitions); 47 CFR 64.2005 (approval).
#   See also: FCC CPNI rules, 2007 Order (FCC 07-22) and 2016 Broadband Order.
#
# What this pack covers (auto-routed via STORM detectors):
#   US phone numbers   -> faker phone_number (subscriber MSISDN; CDR calling/called
#                         numbers in US format; detected by us_phone value-pattern)
#   Device IDs         -> fpe digits (IMEI/device serial columns detected as device_id)
#   Subscriber SSN     -> fpe digits
#   Subscriber names   -> faker (first/last/full)
#   Billing address    -> faker street_address
#   Billing ZIP        -> truncate to 3 digits
#   Account dates      -> date_shift +/- 30 days (CDR timestamps in date form,
#                         account creation / churn dates)
#   Subscriber email   -> faker email
#   Account numbers    -> fpe ALPHANUM (detected as iban by STORM)
#
# Honest gaps -- fields NOT auto-routed by this pack:
#
#   IMEI CHECKSUM (Luhn):
#     IMEI (International Mobile Equipment Identity) is 15 digits with a
#     Luhn check digit at position 15. The device_id detector may fire on
#     IMEI columns (via device_serial / serial_num name hints), but it also
#     fires on non-IMEI device identifiers (IMSI, ICCID, asset IDs) where
#     checksum: luhn would be incorrect.
#
#     If a column is definitively IMEI, add checksum: luhn in the recipe:
#
#       columns:
#         - name: imei
#           strategy: fpe
#           provider_config:
#             charset: digits
#             checksum: luhn
#
#     This pack uses fpe + charset: digits WITHOUT checksum for device_id
#     because the device_id detector cannot distinguish IMEI from IMSI or
#     ICCID, and applying Luhn to a non-IMEI identifier would falsely imply
#     Luhn validity. See 47 CFR 64.2003 definition of "call detail information."
#
#   IMSI / ICCID:
#     IMSI (International Mobile Subscriber Identity, 15 digits) and ICCID
#     (Integrated Circuit Card ID, 18-22 digits) have no registered STORM
#     detectors. The device_id detector may fire on these columns by name
#     hint (serial_num, device_id patterns), but columns named "imsi" or
#     "iccid" will not auto-route unless the name hint fires. Configure
#     manually with fpe + charset: digits (no Luhn for IMSI; ICCID can be
#     Luhn-validated on its 18-20 digit forms but no scheme is registered).
#
#   INTERNATIONAL MSISDN (E.164 / non-US format):
#     The us_phone detector matches US-formatted numbers (NANP: +1-NXX-NXX-XXXX).
#     International MSISDNs in E.164 (e.g. "+4915123456789") or bare digit
#     strings (e.g. "4915123456789") will NOT be detected by us_phone.
#     Configure international phone columns manually:
#
#       columns:
#         - name: msisdn
#           strategy: fpe
#           provider_config:
#             charset: digits
#
#   CELL TOWER LAT/LNG (location data):
#     Cell tower latitude/longitude is among the most sensitive CPNI under
#     47 CFR 64.2003 ("location" is explicitly included in the definition).
#     The geo_generalize strategy supports type: lat_lng (H3 hexagonal
#     generalization) but NO STORM detector exists for cell tower coordinate
#     columns. Configure manually:
#
#       columns:
#         - name: cell_lat
#           strategy: geo_generalize
#           provider_config:
#             type: lat_lng
#             cascade: [h3_resolution_9, h3_resolution_7, h3_resolution_5, suppress]
#             k_threshold: 5
#         - name: cell_lng
#           strategy: geo_generalize
#           provider_config:
#             type: lat_lng
#             cascade: [h3_resolution_9, h3_resolution_7, h3_resolution_5, suppress]
#             k_threshold: 5
#
#     Use suppress as the final cascade level so raw coordinates never reach
#     output even when the dataset is too sparse to generalize safely.
#
#   CALL DURATION / DATA USAGE:
#     Numeric CPNI quantities (call_duration_sec, data_usage_bytes, sms_count)
#     have no STORM detector. Configure manually with bucketize:
#
#       columns:
#         - name: call_duration_sec
#           strategy: bucketize
#           provider_config:
#             bins: [0, 30, 120, 600, 3600]
#             labels: ["<30s", "30s-2m", "2m-10m", "10m-1h", ">1h"]
#
#   CDR CALLING / CALLED NUMBERS (non-US format):
#     CDR origin/destination numbers in non-NANP format (international, raw
#     digit strings) will not match the us_phone value regex. Configure
#     manually with fpe + charset: digits for format-preserving pseudonymisation.
#
# Differential privacy note:
#   No strategy in this pack provides differential-privacy-grade guarantees.
#   FPE is pseudonymisation; faker substitution is anonymisation. If DP-grade
#   de-identification is required, this pack does not satisfy that requirement.
#
# Legal note (47 U.S.C. 222 framing):
#   This pack assists with data engineering de-identification for testing,
#   analytics, and development. It does not constitute legal CPNI compliance
#   and does not satisfy carrier obligations for data sharing or disclosure
#   approvals under 47 CFR 64.2005. Consult telecom counsel before using
#   masked CPNI data in regulatory submissions.

id: cpni
version: "2026-06-29"
name: "CPNI Telecom"
summary: "Customer Proprietary Network Information protection under 47 CFR Part 64 Subpart U / 47 U.S.C. 222: subscriber SSN, US phone numbers, device IDs (fpe digits), names, billing address, account dates. SP-12. Honest gaps: IMEI Luhn requires manual column config; international MSISDNs, IMSI, ICCID, cell tower lat/lng, call duration, and CDR non-US numbers have no STORM detectors and require manual recipe config."
regulation: "FCC CPNI rules - 47 CFR Part 64 Subpart U (implementing 47 U.S.C. 222)"
primary_buyer: "Telecom data engineers"

triggers:
  any_detectors:
    - device_id
  co_occurrence:
    # Subscriber record shape: SSN + phone + name (billing master file).
    - [ssn, us_phone, person_name]
    - [ssn, us_phone, first_name]
    # CDR-adjacent shape: multiple phone columns (calling + called) + date.
    - [us_phone, iso_date]
    - [us_phone, us_date]
  min_score: 0.35

# Strict-mode fail-safe contract (V1). CPNI datasets vary widely; a CDR
# table may have no SSN while a subscriber master file has no device_id.
# These expected_fields cover the broadest subscriber-record shape.
expected_fields:
  - ssn                              # subscriber SSN (CPNI / GLBA NPI)
  - us_phone                         # subscriber MSISDN; CDR numbers (US format)
  - device_id                        # IMEI / device serial
  - [first_name, last_name, person_name]  # subscriber name
  - address                          # billing address
  - us_zip                           # billing ZIP
  - [iso_date, us_date, eu_date]     # account dates; CDR timestamps (date portion)
  - email                            # subscriber contact email
  - iban                             # payment / account number

field_rules:
  # Subscriber SSN: fpe digits. Deterministic so joins across subscriber tables survive.
  # CPNI billing data can include SSN for identity verification; covered as NPI
  # under GLBA where the carrier is also a financial institution.
  - detectors: [ssn]
    mask: fpe
    params:
      charset: digits
    why: "Subscriber SSN -> fpe digits. Deterministic so subscriber-record joins survive. 47 CFR 64.2003 CPNI definition includes billing information."

  # US phone numbers (subscriber MSISDN, CDR calling/called numbers in NANP format).
  # faker phone_number produces a realistic US-format substitution. Format-preserving
  # FPE is an alternative for FK joins across CDR tables; configure manually if needed.
  # NOTE: Faker breaks FK joins across CDR tables. If calling_number and called_number
  # columns join to a subscriber_id table, use fpe + charset: digits manually instead.
  - detectors: [us_phone]
    mask: faker
    params:
      faker_type: phone_number
    why: "Subscriber MSISDN and US-format CDR numbers -> realistic fake phone number. 47 CFR 64.2003: call detail information includes called/calling numbers. NOTE: faker breaks FK joins; use fpe+digits manually for CDR tables with cross-column phone joins."

  # Device IDs (IMEI / device serials detected via device_id name hints).
  # Using fpe + charset: digits WITHOUT checksum because device_id catches non-IMEI
  # identifiers (IMSI, ICCID, serial numbers) where Luhn would be wrong.
  # For columns definitively containing 15-digit IMEIs, add checksum: luhn manually.
  # See HONEST GAPS section in YAML header above.
  - detectors: [device_id]
    mask: fpe
    params:
      charset: digits
    why: "Device identifier columns (IMEI, IMSI, ICCID via device_id detector) -> fpe digits. Format-preserving without checksum because device_id catches non-IMEI identifiers where Luhn would over-claim. For 15-digit IMEI columns specifically, add checksum: luhn in the recipe YAML. 47 CFR 64.2003 CPNI: device identifiers are CPNI when they relate to service configuration."

  # Subscriber names.
  - detectors: [first_name]
    mask: faker
    params:
      faker_type: first_name
    why: "Subscriber first name -> realistic fake. 47 CFR 64.2003 CPNI billing information."

  - detectors: [last_name]
    mask: faker
    params:
      faker_type: last_name
    why: "Subscriber last name -> realistic fake."

  - detectors: [person_name]
    mask: faker
    params:
      faker_type: name
    why: "Subscriber full name -> realistic fake."

  # Billing address: realistic fake street address.
  # NOTE: For datasets where address, city, zip, and state appear together,
  # configure joint_mask: us_zip5_city_state in recipe YAML for consistency.
  - detectors: [address]
    mask: faker
    params:
      faker_type: street_address
    why: "Subscriber billing address -> realistic fake street address. ZIP coarsened separately by us_zip rule. NOTE: for co-located zip+city+state columns, configure joint_mask: us_zip5_city_state in recipe YAML."

  # Billing ZIP: truncate to 3-digit prefix.
  - detectors: [us_zip]
    mask: truncate
    params:
      length: 3
    why: "Subscriber billing ZIP -> 3-digit prefix. Geographic coarsening reduces subscriber re-identification risk. 47 CFR 64.2003: location is explicitly included in CPNI."

  # Account and CDR dates: +/- 30-day shift. Covers subscriber account creation,
  # churn date, and CDR timestamp date portions. Preserves analytic distribution.
  - detectors: [iso_date, us_date, eu_date]
    mask: date_shift
    params:
      jitter_days: 30
    why: "Subscriber account dates and CDR date columns -> +/- 30-day jitter. Preserves temporal analytics; breaks exact-date correlation. 47 CFR 64.2003: date/time is call detail information."

  # Subscriber contact email.
  - detectors: [email]
    mask: faker
    params:
      faker_type: email
    why: "Subscriber contact email -> realistic fake. CPNI billing information."

  # Payment / account numbers (detected as iban): FPE ALPHANUM.
  # Covers bank account numbers in the subscriber billing record.
  - detectors: [iban]
    mask: fpe
    params:
      charset: ALPHANUM
    why: "Subscriber payment / account numbers -> fpe ALPHANUM. Joins survive; no clear-text account number persists. CPNI billing information; also GLBA NPI where carrier is a financial institution."

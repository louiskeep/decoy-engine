# P&C (Property and Casualty) Insurance Compliance Pack (SP-12).
#
# Regulatory basis:
#   - GLBA Safeguards Rule (16 CFR Part 314, updated 2023): applies to insurance
#     companies that are "financial institutions" under the FTC Act; covers NPI
#     (non-public personal information) including policyholder identity, financial
#     account data, and claims data.
#   - State insurance commissioner regulations (NAIC Model Insurance Data Security
#     Law / Model 668): adopted by most states; requires protection of "nonpublic
#     information" including personal information, financial information, and health
#     information held by insurers. References: NAIC.org Model Law 668.
#   - CCPA (Cal. Civ. Code 1798.100 et seq.) where policyholders are CA residents.
#
# What this pack covers (auto-routed via STORM detectors):
#   SSN         -> fpe digits (policyholder Social Security Number)
#   VIN         -> fpe ALPHANUM + checksum: vin (ISO 3779 / NHTSA 49 CFR Part 565)
#   License     -> redact (driver license number; no universal state format)
#   Names       -> faker (policyholder first/last/full name)
#   Address     -> faker (insured / property address)
#   ZIP         -> truncate to 3 digits (geographic coarsening per GLBA approach)
#   Dates       -> date_shift +/- 30 days (policy effective, loss, DOB)
#   Email       -> faker (policyholder contact email)
#   Phone       -> faker (policyholder contact phone)
#   Account     -> fpe ALPHANUM (bank / payment account numbers detected as iban)
#
# Honest gaps -- fields NOT auto-routed by this pack (no STORM detectors):
#
#   POLICY NUMBER:
#     No STORM detector for policy numbers. Formats vary by insurer
#     (alphanumeric, numeric with check digits, etc.). Configure manually:
#
#       columns:
#         - name: policy_number
#           strategy: fpe
#           provider_config:
#             charset: ALPHANUM
#
#     No checksum scheme covers generic P&C policy numbers; FPE preserves
#     format and length without validity-by-construction for arbitrary formats.
#
#   CLAIM NUMBER:
#     No STORM detector for claim numbers. Same manual-config approach applies.
#
#   PREMIUM / LOSS / RESERVE AMOUNTS:
#     Numeric amount columns (premium, loss, reserve, deductible) have no
#     STORM detector. Configure manually with bucketize:
#
#       columns:
#         - name: loss_amount
#           strategy: bucketize
#           provider_config:
#             bins: [0, 1000, 5000, 25000, 100000, 500000]
#             labels: ["<1K", "1K-5K", "5K-25K", "25K-100K", "100K-500K", ">500K"]
#
#   LOSS DESCRIPTION / ADJUSTER NOTES:
#     Free-text columns (loss descriptions, adjuster notes, repair narratives)
#     have no STORM detector. Configure text_mask manually:
#
#       columns:
#         - name: loss_description
#           strategy: text_mask
#           provider_config:
#             unmatched_span_policy: redact
#
#     The safe default (unmatched_span_policy: redact) prevents undetected PII
#     in prose from passing through. Use passthrough ONLY when the surrounding
#     text is known to be non-sensitive.
#
#   AGENT / ADJUSTER IDs:
#     No STORM detector for agent or adjuster identifiers. Configure manually
#     with fpe (format-preserving) or redact as appropriate.
#
#   VEHICLE MAKE / MODEL / YEAR:
#     Make, model, and year are quasi-identifiers that can narrow the pool of
#     potential individuals when combined with ZIP, date, and claim data.
#     No STORM detector exists for these fields. Generalize manually with
#     categorical (replace with a shuffled value from the same set) or bucketize
#     (year ranges). joint_mask: vehicle_ref_table is the right long-term tool
#     but the corpus is not yet shipped.
#
# VIN checksum note:
#   The vehicle_id -> fpe + checksum: vin rule produces masked VINs that are
#   valid by construction per ISO 3779 / NHTSA 49 CFR Part 565 Appendix B
#   (position-9 check character via transliteration table + positional weights).
#   The fpe ALPHANUM charset covers the VIN character set (0-9, A-Z minus I/O/Q).
#   Masked VINs pass standard VIN validators used in downstream DMV/fleet systems.
#
# Differential privacy note:
#   No strategy in this pack provides differential-privacy-grade guarantees.
#   FPE is pseudonymisation; date_shift and truncate are anonymisation
#   techniques. If DP-grade de-identification is required for any field, this
#   pack does not satisfy that requirement.

id: pc
version: "2026-06-29"
name: "P&C Insurance"
summary: "Property and Casualty insurance NPI protection under GLBA Safeguards Rule (16 CFR Part 314) and NAIC Model 668: policyholder SSN, VIN (ISO 3779 checksum-valid), driver license, names, contact, dates. SP-12. Honest gaps: policy number, claim number, amounts, loss descriptions, and agent IDs have no STORM detectors and require manual column config."
regulation: "GLBA Safeguards Rule (16 CFR Part 314, 2023 update); NAIC Model Insurance Data Security Law (Model 668); CCPA where applicable"
primary_buyer: "P&C insurance data engineers"

triggers:
  any_detectors:
    - vehicle_id
    - license_num
  co_occurrence:
    # Classic auto policy shape: policyholder SSN + VIN + driver's license.
    - [ssn, vehicle_id, license_num]
    # Homeowners / renter shape: SSN + address + ZIP.
    - [ssn, address, us_zip]
    # Minimal P&C shape: VIN + identity.
    - [vehicle_id, person_name]
    - [vehicle_id, first_name, last_name]
  min_score: 0.4

# Strict-mode fail-safe contract (V1). The P&C pack expects these detectors
# to fire on a well-formed P&C dataset. Permissive mode bypasses with an
# audit trail if a field is absent (e.g. a homeowners policy with no VIN).
expected_fields:
  - ssn                              # policyholder SSN (GLBA NPI)
  - vehicle_id                       # VIN (auto policy identifier)
  - license_num                      # driver license (auto policy)
  - [first_name, last_name, person_name]  # policyholder name
  - address                          # insured / property address
  - us_zip                           # geographic unit
  - [iso_date, us_date, eu_date]     # policy dates, loss dates, DOB
  - email                            # policyholder contact email
  - us_phone                         # policyholder contact phone
  - iban                             # premium payment account

field_rules:
  # SSN: format-preserving FPE; deterministic so FK joins survive.
  # Covers policyholder and co-insured SSN columns.
  # GLBA §6809(4)(A): SSN is NPI (non-public personal information).
  - detectors: [ssn]
    mask: fpe
    params:
      charset: digits
    why: "Policyholder SSN -> fpe digits. Format-preserving; deterministic so FK joins survive. GLBA Safeguards Rule NPI (16 CFR Part 314)."

  # VIN: FPE with ISO 3779 check digit. ALPHANUM covers the VIN character
  # set (0-9, A-Z excluding I/O/Q per NHTSA 49 CFR Part 565 Appendix B).
  # Masked VINs pass VIN checksum validators by construction (checksum: vin
  # recomputes position-9 after permuting the other 16 characters).
  # Deterministic so vehicle-level joins survive masking.
  - detectors: [vehicle_id]
    mask: fpe
    params:
      charset: ALPHANUM
      checksum: vin
    why: "VIN -> fpe ALPHANUM with checksum: vin. Masked VINs are valid by construction per ISO 3779 / NHTSA 49 CFR Part 565 Appendix B. Deterministic so vehicle-level joins survive masking."

  # Driver license: no universal format across 50 US states (alphanumeric,
  # numeric-only, length varies from 1 to 16 chars). Redact is the only
  # honest choice; FPE would not produce a state-valid license number.
  - detectors: [license_num]
    mask: redact
    params:
      redact_with: "[REDACTED]"
    why: "Driver license numbers vary too widely across US states for FPE format-preservation to be meaningful. Redacted. GLBA / NAIC Model 668 NPI."

  # Policyholder names: realistic fake substitutes preserve dataset density.
  # Specific-name detectors route first so first_name/last_name columns get
  # the matching Faker provider (first_name/last_name), not the catch-all name.
  - detectors: [first_name]
    mask: faker
    params:
      faker_type: first_name
    why: "Policyholder first name -> realistic fake first name. GLBA NPI (16 CFR Part 314)."

  - detectors: [last_name]
    mask: faker
    params:
      faker_type: last_name
    why: "Policyholder last name -> realistic fake last name. GLBA NPI."

  - detectors: [person_name]
    mask: faker
    params:
      faker_type: name
    why: "Policyholder full name -> realistic fake name. GLBA NPI."

  # Property / insured address: realistic fake street address.
  # NOTE: For datasets where address, city, zip, and state appear together,
  # configure joint_mask: us_zip5_city_state in the recipe YAML instead for
  # geographic consistency. joint_mask requires a key_by column name that is
  # dataset-specific and cannot be set pack-wide.
  - detectors: [address]
    mask: faker
    params:
      faker_type: street_address
    why: "Insured / property address -> realistic fake street address. ZIP is coarsened separately by the us_zip rule. NOTE: for co-located zip+city+state columns, configure joint_mask: us_zip5_city_state in recipe YAML."

  # ZIP: truncate to 3-digit prefix. GLBA-level coarsening (not HIPAA Safe
  # Harbor cascade; P&C is state-regulated, not HIPAA-covered). Preserves
  # regional analytics (territory rating) while dropping re-identification risk.
  - detectors: [us_zip]
    mask: truncate
    params:
      length: 3
    why: "Policyholder ZIP -> 3-digit prefix. Geographic coarsening reduces re-identification risk while preserving territory-rating analytics. GLBA Safeguards Rule / NAIC Model 668 NPI."

  # Dates: +/- 30-day random shift. Covers policy effective dates, loss dates,
  # DOB, and policy expiry dates. Preserves analytic distribution; breaks
  # exact-date correlations with unmasked source.
  - detectors: [iso_date, us_date, eu_date]
    mask: date_shift
    params:
      jitter_days: 30
    why: "Policy and loss dates -> +/- 30-day jitter. Preserves temporal analytics; breaks exact date correlation. GLBA NPI / NAIC Model 668."

  # Contact email: realistic fake.
  - detectors: [email]
    mask: faker
    params:
      faker_type: email
    why: "Policyholder contact email -> realistic fake. GLBA NPI."

  # Contact phone: realistic fake.
  - detectors: [us_phone]
    mask: faker
    params:
      faker_type: phone_number
    why: "Policyholder contact phone -> realistic fake. GLBA NPI."

  # Bank / payment account (detected as IBAN by STORM): FPE ALPHANUM.
  # Preserves account-length shape; joins survive via determinism.
  - detectors: [iban]
    mask: fpe
    params:
      charset: ALPHANUM
    why: "Premium payment / bank account numbers -> fpe ALPHANUM. Joins survive; no clear-text account number persists. GLBA NPI financial account data."

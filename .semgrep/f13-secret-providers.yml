# F13 structural leak sentry (build-failing). Static-analysis rules, not a bespoke tool.
# Scope: src/decoy_engine/secret_providers/** plus the execution/consumer modules that must not
# reach a provider directly. Runtime coverage is the seeded-marker suite in tests/secret_providers.
rules:
  - id: f13-no-logging-in-secret-providers
    languages: [python]
    severity: ERROR
    message: "Secret providers must not log, print or warn: buffers, refs and SDK errors never reach a log sink."
    paths:
      include: [/src/decoy_engine/secret_providers/]
    pattern-either:
      - pattern: print(...)
      - pattern: logging.$F(...)
      - pattern: logger.$F(...)
      - pattern: $L.exception(...)
      - pattern: warnings.warn(...)

  - id: f13-no-exception-chaining-in-secret-providers
    languages: [python]
    severity: ERROR
    message: "A provider failure must not retain its cause (`raise ... from exc`); use `from None` or raise outside the except block so logging.exception cannot print provider internals."
    paths:
      include: [/src/decoy_engine/secret_providers/]
    patterns:
      - pattern: raise $E from $C
      - pattern-not: raise $E from None

  - id: f13-no-exception-text-in-secret-providers
    languages: [python]
    severity: ERROR
    message: "Never render a caught exception (str/repr/format/f-string) in a secret provider; map it by TYPE to a fixed reason."
    paths:
      include: [/src/decoy_engine/secret_providers/]
    patterns:
      - pattern-inside: |
          try:
            ...
          except $T as $E:
            ...
      - pattern-either:
          - pattern: str($E)
          - pattern: repr($E)
          - pattern: f"...{$E}..."
          - pattern: $E.args
          - pattern: $E.response

  - id: f13-no-serializers-on-secret-modules
    languages: [python]
    severity: ERROR
    message: "Secret-bearing modules must not serialize (json/pickle/copy/dataclasses.asdict)."
    paths:
      include:
        - /src/decoy_engine/secret_providers/_buffer.py
        - /src/decoy_engine/secret_providers/_cache.py
        - /src/decoy_engine/secret_providers/_preflight.py
    pattern-either:
      - pattern: json.dump(...)
      - pattern: json.dumps(...)
      - pattern: pickle.$F(...)
      - pattern: copy.$F(...)
      - pattern: dataclasses.asdict(...)

  - id: f13-no-direct-provider-resolution-outside-package
    languages: [python]
    severity: ERROR
    message: "Execution and consumer modules must admit secrets through secret_providers.admit_mask_key, never import a concrete provider or call resolve() directly."
    paths:
      include:
        - /src/decoy_engine/execution/
        - /src/decoy_engine/unmask.py
        - /src/decoy_engine/vault.py
    pattern-either:
      - pattern: from decoy_engine.secret_providers._local import $X
      - pattern: from decoy_engine.secret_providers.vault import $X
      - pattern: import hvac
      - pattern: from hvac import $X
      - pattern: $P.resolve($REF)

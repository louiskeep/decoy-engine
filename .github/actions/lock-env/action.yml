name: lock-env
description: Install the engine from uv.lock into a venv outside the workspace and check the key dependencies against the lock.
inputs:
  extras:
    description: Space-separated uv extras (for example "dev ml").
    default: ""
  python:
    description: Exact CPython patch uv installs for the venv.
    default: "3.10.20"
  bootstrap:
    description: '"true" runs scripts/dev/bootstrap.sh (the Mac gate profile) instead of a plain sync.'
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-uv
    - name: Lock venv outside the workspace
      shell: bash
      run: |
        echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
        echo "DECOY_VENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
    - name: Install from uv.lock
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
        PYTHON: ${{ inputs.python }}
        BOOTSTRAP: ${{ inputs.bootstrap }}
      run: |
        if [ "$BOOTSTRAP" = "true" ]; then
          bash scripts/dev/bootstrap.sh
        else
          args=()
          for e in $EXTRAS; do args+=(--extra "$e"); done
          uv sync --frozen ${args[@]+"${args[@]}"} --python "$PYTHON"
        fi
    - name: Installed versions equal the lock
      shell: bash
      run: |
        for pkg in pyarrow polars duckdb pandas; do
          have=$(python -c "import importlib.metadata as m; print(m.version('$pkg'))")
          want=$(bash scripts/dev/lock_version.sh "$pkg")
          echo "$pkg installed $have lock $want"
          test "$have" = "$want" || { echo "$pkg differs from uv.lock"; exit 1; }
        done

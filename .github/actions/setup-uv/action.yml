name: setup-uv
description: Install uv at the one version uv.lock was generated with. Every workflow gets uv through here.
runs:
  using: composite
  steps:
    # v5 tag, pinned to its commit so a moved tag cannot change what runs.
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        version: "0.11.19"

# Build (and on main, deploy) the engine API reference docs.
#
# Build runs on every push and PR that touches docs/, src/decoy_engine/,
# or pyproject.toml. The deploy job runs only on main pushes and only
# after build succeeds.
#
# ── GitHub Pages requirements ────────────────────────────────────────────
# Before the deploy job can succeed, Pages must be enabled in repo settings:
#   Settings → Pages → Source: GitHub Actions
#
# This repo (louiskeep/decoy-engine) is public. Deploy stays off until the DOCS_DEPLOY
# variable is set to "true" and Pages is enabled; the build job uploads the HTML as an artifact.
#
# Item 50 Phase E in the cross-repo plan.

name: docs

on:
  # Manual dispatch only. gate-selfhosted.yml is the merge gate; the paid runners
  # fire on demand so they stop failing every push (X0a). Old triggers: git history.
  workflow_dispatch:

# The build job gets read-only contents; only deploy holds the Pages scopes.
permissions:
  contents: read

# Serialize concurrent deploys; cancel-in-progress=false so an in-flight
# deploy isn't aborted mid-write (which can leave Pages in a half-deployed
# state).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Lock venv outside the workspace
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "DECOY_VENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: uv sync --frozen --extra docs --python 3.11
      - name: Installed versions
        run: |
          python -c "import importlib.metadata as m; print({d: m.version(d) for d in ('pyarrow', 'polars', 'duckdb', 'pandas')})"

      - name: Build (warnings as errors)
        # -W: treat warnings as errors. Mirrors the local `make html-strict`
        # contract — a green local build is what lands on Pages.
        # --keep-going: collect every error in one pass rather than bailing
        # on the first, so a contributor sees the whole picture.
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Only deploy on main, AND only when the DOCS_DEPLOY repo variable is "true"
  # (Settings -> Secrets and variables -> Actions -> Variables). Pages is not enabled yet,
  # so deploy stays OFF to keep main green. PRs still get the build for validation
  # (HTML downloadable as a workflow artifact); they never overwrite the live site.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# engine-v2 substrate matrix (S11).
#
# Runs the execution test suite under DECOY_SUBSTRATE=pandas on every change
# that touches the execution package. Pandas is the only masking substrate
# since the dormant polars masking adapter was removed, so the matrix carries a
# single leg (kept as a matrix so a future substrate slots straight back in).
#
# Trigger is scoped to the execution package (Engine-reality note #3: the v2
# masking spine triggers key off decoy_engine/execution/**), so a PR that does
# not touch execution does not pay the extra runtime.

name: engine-v2-substrate-matrix

on:
  push:
    branches: [main]
    paths:
      - "src/decoy_engine/execution/**"
      - ".github/workflows/engine-v2-substrate-matrix.yml"
  pull_request:
    paths:
      - "src/decoy_engine/execution/**"
      - ".github/workflows/engine-v2-substrate-matrix.yml"

jobs:
  substrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        substrate: [pandas]
    env:
      DECOY_SUBSTRATE: ${{ matrix.substrate }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install engine + dev extras
        run: pip install -e ".[dev]"
      - name: Execution tests under DECOY_SUBSTRATE=${{ matrix.substrate }}
        # Benchmark suite excluded per resolved question #19 (dedicated SKU).
        # codspeed + packaging excluded too (they need optional extras not in
        # [dev]: tests/codspeed uses the pytest-codspeed `benchmark` fixture),
        # matching the regression-gate selector in ci.yml.
        run: pytest tests -m "not benchmark and not codspeed and not packaging" --tb=short

# Security audit. Exports uv.lock (every extra) with `uv export` and runs `pip-audit` against it
# once per supported Python. Catches CVEs in any pinned dep (direct or transitive).
#
# Mirrors decoy-platform's security.yml so the engine gates supply-chain CVEs
# the same way the platform already does. Triggered on every PR + on a
# Monday-morning schedule: PR runs gate the merge; the scheduled run catches
# CVEs that landed against deps we haven't touched in a while.

name: Security

on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:


permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One leg per supported Python, each a separate pip-audit exit code, so a green leg cannot
    # hide a red one. pip-audit evaluates the export's markers against its own interpreter, so
    # one run on 3.12 would skip every 3.10-only pin (requires-python >=3.10,<3.13). The legs
    # must equal the supported minors; tests/sentry/test_ci_lock_installs.py checks that.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-uv

      - name: Export the locked dependency set (every extra, hashed pins)
        run: uv export --frozen --all-extras --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/engine-lock.txt"

      - name: Audit the lock
        # Audits what the engine ships, not this job's tool environment: pip-audit runs in its
        # own uvx environment, so its own dependencies never enter the report. --strict fails the
        # leg on any known vulnerability; no ignore list. Keep this one bare command: the sentry
        # rejects || ; if, exit 0, set +e and continue-on-error around it.
        env:
          PY: ${{ matrix.python }}
        run: uvx --python "$PY" pip-audit==2.10.1 --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/engine-lock.txt"

  # F13 structural leak sentry: secret-provider modules may not log, chain exceptions, render
  # exception text or serialize, and execution modules may not reach a concrete provider.
  # Runtime seeded-marker coverage lives in tests/secret_providers.
  secret-provider-semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install 'semgrep==1.183.0'

      - name: Scan
        run: semgrep --config .semgrep/f13-secret-providers.yml --metrics=off --error src/decoy_engine

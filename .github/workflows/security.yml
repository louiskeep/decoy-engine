# Security audit. Runs `pip-audit` against the engine's resolved dependency
# tree. Catches CVEs in any pinned dep (direct or transitive).
#
# Mirrors decoy-platform's security.yml so the engine gates supply-chain CVEs
# the same way the platform already does. Triggered on every PR + on a
# Monday-morning schedule: PR runs gate the merge; the scheduled run catches
# CVEs that landed against deps we haven't touched in a while.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"  # Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          # setuptools ships in the runner env as a build tool; keep it ahead of
          # PYSEC-2026-3447 (fixed in 83.0.0) so the audited env has no known CVE.
          pip install --upgrade 'setuptools>=83.0.0'
          pip install pip-audit

      # Audit the project's resolved deps. pip-audit reads pyproject.toml by
      # default and resolves the full transitive tree. `--strict` fails the
      # job on any known CVE.
      - name: Audit dependencies
        run: pip-audit --strict

  # F13 structural leak sentry: secret-provider modules may not log, chain exceptions, render
  # exception text or serialize, and execution modules may not reach a concrete provider.
  # Runtime seeded-marker coverage lives in tests/secret_providers.
  secret-provider-semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install 'semgrep==1.183.0'

      - name: Scan
        run: semgrep --config .semgrep/f13-secret-providers.yml --metrics=off --error src/decoy_engine

# The merge gate: scripts/dev/gates.sh (env, ruff, format, mypy, sentry, licenses, impact-selected
# tests) on the always-on Mac, so a push is checked by the same command a builder runs locally.
# Needs a runner registered with labels self-hosted, macos, decoy-gate (owner ops step).
#
# flock holds ~/.cache/pytest-one.lock for the whole command, the same lock ~/bin/pytest-one
# takes, so the gate queues behind any full-suite run on the box. pytest-one cannot wrap
# gates.sh because it always runs `python -m pytest`.
name: gate-selfhosted

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-selfhosted-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: [self-hosted, macos, decoy-gate]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch origin/main for the merge base
        run: git fetch origin main
      - name: Gate
        # EVIDENCE block names the head it tested; keep-going lists every red step.
        run: |
          export DECOY_VENV="$HOME/.cache/decoy-gate-venv"
          flock ~/.cache/pytest-one.lock scripts/dev/gates.sh --keep-going

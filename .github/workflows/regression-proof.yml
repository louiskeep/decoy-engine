# Bugfix regression proof (best-practices section 2.4), opt-in via the `bugfix` label.
#
# For a PR labelled `bugfix`, re-runs its @pytest.mark.regression test(s) against
# the merge-base (pre-fix code) and fails unless they FAIL there. A regression
# test that already passes without the fix does not prove the bug. PRs without
# the label do not run this job.

name: Prove regression

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prove-regression:
    if: contains(github.event.pull_request.labels.*.name, 'bugfix')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/lock-env
        with:
          extras: "dev"
      - name: Fetch base branch
        run: git fetch origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Prove the regression test fails on the pre-fix baseline
        run: python scripts/prove_regression.py
        env:
          BASE_REF: ${{ github.base_ref }}

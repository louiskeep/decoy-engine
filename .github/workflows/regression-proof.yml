# Bugfix regression proof (best-practices section 2.4), opt-in via the `bugfix` label.
#
# For a PR labelled `bugfix`, re-runs its @pytest.mark.regression test(s) against
# the merge-base (pre-fix code) and fails unless they FAIL there. A regression
# test that already passes without the fix does not prove the bug. PRs without
# the label do not run this job.

name: Prove regression

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  prove-regression:
    if: contains(github.event.pull_request.labels.*.name, 'bugfix')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Lock venv outside the workspace
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "DECOY_VENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: uv sync --frozen --extra dev --python 3.10.20
      - name: Installed versions
        run: |
          python -c "import importlib.metadata as m; print({d: m.version(d) for d in ('pyarrow', 'polars', 'duckdb', 'pandas')})"

      - name: Fetch base branch
        run: git fetch origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Prove the regression test fails on the pre-fix baseline
        run: python scripts/prove_regression.py
        env:
          BASE_REF: ${{ github.base_ref }}

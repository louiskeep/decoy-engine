# Native masking hot path (engine-efficiency-plan Part 1 Phase 2) and the supported
# production matrix (Task 3.1, Phase 3).
#
# Three concerns: the companion package is the only thing that needs a Rust
# toolchain (matching the Option B split, docs/native/supported-matrix.md); the core
# must prove it stays installable and importable with the companion both present and
# absent; and the one security-sensitive unit (the KeyedDerivationKernel)
# gets fuzz and sanitizer evidence beyond ordinary tests. ci.yml's existing
# jobs (ruff/mypy/regression-gate/...) already cover the companion-absent
# state today (they install `.[dev]` only); this workflow adds the companion
# build, the companion-present state, the fuzz/sanitizer gate, and a
# companion-absent job scoped to exactly the two-state test file so a
# reviewer can see every side of the split in one place.
#
# Task 3.1 widened the wheel matrix to the four approved companion targets (Linux
# x86-64, Linux ARM64, Windows x86-64, macOS arm64) x cp310-cp312, all built with
# PyO3/maturin-action (never cibuildwheel -- this repo does not use it) and all routed
# through the shared decoy-engine-native/scripts/parity_smoke.py so every row checks
# the same ABI + hash-KAT + index-KAT contract. The Linux smoke additionally runs
# INSIDE the pinned manylinux_2_28 container (by digest, distinct per architecture),
# which makes "oldest tested runtime" a real, pinned fact rather than a floating
# `ubuntu-latest` claim -- see docs/native/supported-matrix.md for how this maps to
# the three separately-stated facts (wheel-compat policy / tested runtime / production
# base). The Windows and macOS jobs were NOT run locally (this environment has no
# matching runner or hardware) and are verified by inspection against maturin-action's
# documented behavior; they get real verification in CI on the PR. The fuzz/sanitizer
# job's commands (nightly toolchain, cargo-fuzz, `-Zbuild-std` ASan/TSan) WERE run
# locally against this exact crate before being wired in here.

name: native-companion

on:
  push:
    branches: [main]
    paths:
      - "decoy-engine-native/**"
      - "src/decoy_engine/execution/native/**"
      # Whole native test tree, not an enumerated file list: a per-file list
      # silently failed to trigger (and failed to run) new native tests once
      # before, which is exactly the gap that let an unrun proof through. The
      # companion-dependent route/parity tests live under tests/parity/native.
      - "tests/native/**"
      - "tests/parity/native/**"
      - "pyproject.toml"
      - ".github/workflows/native-companion.yml"
  pull_request:
    paths:
      - "decoy-engine-native/**"
      - "src/decoy_engine/execution/native/**"
      - "tests/native/**"
      - "tests/parity/native/**"
      - "pyproject.toml"
      - ".github/workflows/native-companion.yml"

jobs:
  # companion-wheel-linux: builds the companion across the self-hosted single-org
  # deployment's Linux target matrix (manylinux_2_28 x86_64 + aarch64, cp310-cp312 per
  # the core's requires-python floor) and asserts the compiled `_kernel` extension
  # actually landed in the wheel. A build that silently skips the Rust step (a
  # misconfigured maturin invocation, a stale cache) would otherwise ship a companion
  # wheel with no compiled module in it.
  #
  # Both the build container (`container:`) and the smoke container (`smoke-image`)
  # are pinned by image digest, resolved live against the registries at authoring
  # time (2026-09-11) -- not a placeholder tag. x86_64 builds and smokes against the
  # same `quay.io/pypa/manylinux_2_28_x86_64` image. aarch64 builds via the
  # `ghcr.io/rust-cross/manylinux_2_28-cross` cross-compilation image (the
  # maturin-action default for this target; no QEMU needed to cross-compile) and
  # smokes under QEMU against the official `quay.io/pypa/manylinux_2_28_aarch64`
  # image, which is the one that actually enforces the glibc 2.28 floor at import
  # time (the cross image is a build tool, not the compatibility baseline).
  companion-wheel-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        target: [x86_64, aarch64]
        include:
          - target: x86_64
            container: "quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c"
            smoke-image: "quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c"
            docker-platform: linux/amd64
          - target: aarch64
            container: "ghcr.io/rust-cross/manylinux_2_28-cross:aarch64@sha256:ca53fa07ecf1c3e6408c51fbca64c036d9d29af832d3f8bb954910e89097f275"
            smoke-image: "quay.io/pypa/manylinux_2_28_aarch64@sha256:ad74e53b713f3b07d8c889c526dc0c6500da9827b45e38739570875fef52e28f"
            docker-platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up QEMU (aarch64 emulation, smoke step only)
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - name: Build companion wheel (manylinux_2_28, ${{ matrix.target }})
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: decoy-engine-native
          target: ${{ matrix.target }}
          manylinux: "2_28"
          container: ${{ matrix.container }}
          maturin-version: v1.15.0
          args: --release --out dist --locked --compatibility pypi -i python${{ matrix.python-version }}
      - name: Assert the compiled _kernel module is present in the wheel
        run: |
          set -euo pipefail
          wheel="$(find decoy-engine-native/dist -name '*.whl' | head -n1)"
          test -n "$wheel" || { echo "no wheel produced"; exit 1; }
          python -m zipfile -l "$wheel" | grep -qE 'decoy_engine_native/_kernel[^/]*\.(so|pyd)' \
            || { echo "MISSING: compiled decoy_engine_native/_kernel extension not in $wheel"; exit 1; }
          echo "OK: $wheel ships the compiled decoy_engine_native/_kernel extension"
      # Every produced wheel is installed, imported, and run through the shared parity
      # smoke script (ABI + both typed KATs), not just filename-checked, so a broken
      # cp311/cp312 or aarch64 build cannot pass on the membership grep alone. The
      # smoke runs INSIDE the pinned manylinux_2_28 container (via the versioned
      # interpreter under /opt/python, the standard manylinux image layout), so this
      # is also the "oldest tested runtime" evidence for docs/native/supported-matrix.md.
      - name: Smoke-test the wheel (install + import + ABI + parity KATs, inside manylinux_2_28)
        run: |
          set -euo pipefail
          wheel="$(find decoy-engine-native/dist -name '*.whl' | head -n1)"
          cptag="cp${python_version//./}"
          docker run --rm --platform ${{ matrix.docker-platform }} \
            -v "$PWD/decoy-engine-native:/w" \
            "${{ matrix.smoke-image }}" bash -c "
              set -euo pipefail
              pybin=/opt/python/${cptag}-${cptag}/bin
              \"\$pybin/pip\" install --quiet \"/w/dist/$(basename "$wheel")\" 'pyarrow>=14'
              \"\$pybin/python\" /w/scripts/parity_smoke.py
            "
        env:
          python_version: ${{ matrix.python-version }}
      - uses: actions/upload-artifact@v7
        with:
          name: companion-wheel-linux-${{ matrix.python-version }}-${{ matrix.target }}
          path: decoy-engine-native/dist/*.whl
          retention-days: 14

  # companion-wheel-windows: the Windows x86-64 row of the approved target matrix
  # (Task 3.1). maturin-action runs natively on `windows-latest` (no manylinux/
  # container arg -- that input is Linux-only); actions/setup-python puts the exact
  # matrix interpreter first on PATH, so `-i python` resolves it without guessing a
  # Windows-specific binary name. Same shared parity_smoke.py as every other target.
  companion-wheel-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build companion wheel (Windows x86-64)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: decoy-engine-native
          target: x86_64-pc-windows-msvc
          maturin-version: v1.15.0
          args: --release --out dist --locked -i python
      - name: Assert the compiled _kernel module is present in the wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find decoy-engine-native/dist -name '*.whl' | head -n1)"
          test -n "$wheel" || { echo "no wheel produced"; exit 1; }
          python -m zipfile -l "$wheel" | grep -qE 'decoy_engine_native/_kernel[^/]*\.(so|pyd)' \
            || { echo "MISSING: compiled decoy_engine_native/_kernel extension not in $wheel"; exit 1; }
          echo "OK: $wheel ships the compiled decoy_engine_native/_kernel extension"
      - name: Smoke-test the wheel (install + import + ABI + parity KATs)
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find decoy-engine-native/dist -name '*.whl' | head -n1)"
          python -m pip install "$wheel" "pyarrow>=14"
          python decoy-engine-native/scripts/parity_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: companion-wheel-windows-${{ matrix.python-version }}
          path: decoy-engine-native/dist/*.whl
          retention-days: 14

  # companion-wheel-macos: the macOS arm64 row of the approved target matrix (Task
  # 3.1). `macos-15` is the current pinned Apple-Silicon runner label (`macos-14` is
  # deprecated); `target: aarch64-apple-darwin` selects the arm64 architecture
  # explicitly rather than relying on the runner's default. Same shared
  # parity_smoke.py as every other target.
  companion-wheel-macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build companion wheel (macOS arm64)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: decoy-engine-native
          target: aarch64-apple-darwin
          maturin-version: v1.15.0
          args: --release --out dist --locked -i python
      - name: Assert the compiled _kernel module is present in the wheel
        run: |
          set -euo pipefail
          wheel="$(find decoy-engine-native/dist -name '*.whl' | head -n1)"
          test -n "$wheel" || { echo "no wheel produced"; exit 1; }
          python -m zipfile -l "$wheel" | grep -qE 'decoy_engine_native/_kernel[^/]*\.(so|pyd)' \
            || { echo "MISSING: compiled decoy_engine_native/_kernel extension not in $wheel"; exit 1; }
          echo "OK: $wheel ships the compiled decoy_engine_native/_kernel extension"
      - name: Smoke-test the wheel (install + import + ABI + parity KATs)
        run: |
          set -euo pipefail
          wheel="$(find decoy-engine-native/dist -name '*.whl' | head -n1)"
          python -m pip install "$wheel" "pyarrow>=14"
          python decoy-engine-native/scripts/parity_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: companion-wheel-macos-${{ matrix.python-version }}
          path: decoy-engine-native/dist/*.whl
          retention-days: 14

  # companion-rust-lint: format + clippy gate on the Rust crate so the first
  # real kernel (Task 2.2) cannot merge without Rust lint enforcement. Pins the
  # same 1.98.0 as rust-toolchain.toml so CI and local builds agree.
  companion-rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust with rustfmt + clippy
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        working-directory: decoy-engine-native
        run: cargo fmt --check
      - name: cargo clippy (deny warnings)
        working-directory: decoy-engine-native
        run: cargo clippy --all-targets -- -D warnings

  # core-companion-present: the core's own test suite, run WITH the compiled
  # companion installed. Same-platform build only (the cross-compiled
  # aarch64 wheel above cannot install on this runner); proves the native
  # `_kernel` import path and the core's optional-dependency wiring together,
  # AND that the compiled kernel matches the live Python reference (the
  # parity harness below), not only the static JSON fixture the Rust suite
  # already covers.
  core-companion-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install stable Rust (companion build only; the core needs none)
        uses: dtolnay/rust-toolchain@stable
      - name: Install engine + dev extras
        run: pip install -e ".[dev]"
      - name: Build and install the companion (maturin, same-platform)
        run: pip install ./decoy-engine-native
      - name: Native ABI test (companion-present case)
        run: pytest tests/native/test_native_ext_abi.py -v --tb=short
      - name: Compiled-kernel-vs-live-reference parity harness
        run: pytest tests/native/test_keyed_derivation_kernel_parity.py -v --tb=short
      # The GIL-release proof (panic-safety, wall-clock parallel speedup, concurrent
      # agreement) only has signal with the compiled companion present; without it all
      # three tests skip. This is the one job that installs it, so it must run them.
      - name: GIL-release proof (companion-present case)
        run: pytest tests/native/test_gil_release.py -v --tb=short
      # The loader self-test/ABI-contract tests and the native-route parity + thread
      # plumbing tests (thread invariance, the native_threads route recorder) are also
      # companion-present-only; without the compiled kernel installed they skip, so they
      # must run in this job too.
      - name: Loader + native-route parity/plumbing (companion-present case)
        run: pytest tests/native/test_crypto_ext_loader.py tests/parity/native/test_phase2_gate.py -v --tb=short
      # The derive_index KAT + differential (Task 2.2) exercise the compiled derive_index_batch
      # against the frozen vectors + the live Python reference; companion-present only.
      - name: derive_index KAT + differential (companion-present case)
        run: pytest tests/native/test_derive_index_kat.py -v --tb=short
      # Task 2.3 wires that compiled index kernel into the deterministic-faker route itself
      # (byte parity across batch sizes/orders/null shapes/thread counts, the exactly-one-
      # batch-call and native_threads-forwarding proofs, companion-absent downgrade + probe
      # ordering, malformed-result fail-closed); companion-present only.
      - name: Faker route integration (companion-present case)
        run: pytest tests/parity/native/test_c1_faker_parity.py tests/native/test_dispatch_faker.py tests/native/test_index_ext.py -v --tb=short
      # Task 3.1 D3: decoy_engine_native.__version__ resolves via importlib.metadata and
      # parses as PEP 440; companion-present only (the package must be installed for its
      # own metadata to resolve).
      - name: Companion __version__ test (companion-present case)
        run: pytest tests/native/test_native_version.py -v --tb=short

  # companion-fuzz-sanitizer: the KeyedDerivationKernel is the one security-sensitive native
  # unit, so it gets fuzz + sanitizer evidence beyond the KAT/proptest/clippy gates above. A
  # bounded libFuzzer campaign over the PyO3-free `batch::derive_array` path (built
  # with the crate's `extension-module` feature off, since pyo3's own feature of that name
  # omits linking libpython, which a standalone fuzz binary does not provide), plus the crate's
  # own test suite run once under AddressSanitizer and the concurrent Send/Sync test run once
  # under ThreadSanitizer (both need `-Zbuild-std` so the standard library itself is
  # sanitizer-instrumented, or the linker rejects the ABI mismatch between instrumented and
  # plain std). A crash, a sanitizer report, or an unexpected process exit fails the job.
  companion-fuzz-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly Rust with rust-src (build-std needs it)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # +nightly is REQUIRED: decoy-engine-native/rust-toolchain.toml pins stable
      # 1.98.0 for reproducible cdylib builds, which overrides the nightly default
      # installed above whenever cargo runs in this dir. The -Zsanitizer / -Zbuild-std
      # flags are nightly-only, so the pin must be overridden per-invocation (the
      # exact form the crate README documents and we verified locally).
      - name: Bounded fuzz campaign over derive_array
        working-directory: decoy-engine-native
        run: cargo +nightly fuzz run derive_array -- -max_total_time=120
      # The index kernel (Task 2.3) gets its own bounded campaign over the PyO3-free
      # batch::derive_index_array path: same admitted-type array generation as derive_array plus a
      # full-range i64 pool_size that drives both pool guards and the modulo arithmetic between them.
      - name: Bounded fuzz campaign over derive_index
        working-directory: decoy-engine-native
        run: cargo +nightly fuzz run derive_index -- -max_total_time=120
      - name: Crate tests under AddressSanitizer
        working-directory: decoy-engine-native
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
      # Filter on "concurrent" so BOTH the cross-call Send/Sync test and the Task 1.5 intra-call
      # multi-range parallel-fill test run under TSan (the split_at_mut disjoint windows are the
      # thing that must be race-free). A name-specific filter silently dropped the newer test.
      # Run the WHOLE unit-test suite under TSan (not a name filter): both parallel fills
      # (derive_array byte windows + derive_index u64 slots) and every concurrency test live in
      # `--lib`, so a filter would silently miss a newly added parallel test. The unit tests are
      # fast even under `-Zbuild-std`.
      - name: Unit tests under ThreadSanitizer
        working-directory: decoy-engine-native
        env:
          RUSTFLAGS: -Zsanitizer=thread
        run: cargo +nightly test --lib -Zbuild-std --target x86_64-unknown-linux-gnu
      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: decoy-engine-native/fuzz/artifacts/
          retention-days: 14

  # core-companion-absent: the mirror state. No Rust, no companion; proves
  # the compiled companion really is optional (no `native` extra exists yet;
  # it is never installed via one) and the core stays importable and
  # runnable without it. ci.yml's regression-gate already installs `.[dev]`
  # only and runs the whole suite, so this job scopes to the one test file
  # that encodes the explicit guard (a full-suite run here would duplicate
  # regression-gate for no new signal).
  core-companion-absent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install engine + dev extras (companion NOT installed)
        run: pip install -e ".[dev]"
      - name: Native ABI test (companion-absent case)
        run: pytest tests/native/test_native_ext_abi.py -v --tb=short

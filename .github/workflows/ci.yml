# V2.0-prep CI workflow.
#
# Three separate jobs (ruff / mypy / regression-gate) so a failure points
# at the specific gate that tripped. ruff + mypy stay fast and focused;
# regression-gate runs the whole non-benchmark suite in one invocation,
# preceded by a routing guard that fails if a named suite directory is
# renamed or removed (so coverage cannot silently shrink).
#
# Why separate jobs and not one combined: a single shell-step setup keeps
# the YAML short, but combined jobs hide which gate broke the build. When a
# contributor sees "CI failed" they want "ruff" vs "mypy" vs
# "regression-gate" at a glance, not interleaved logs.
#
# Why no separate self-hosted runner yet: the lint + type + test tier runs
# comfortably on ubuntu-latest. Self-hosted infra arrives in V2.x for the
# benchmark guardrail (per engineering-best-practices section 7.3,
# sub-second perf numbers from shared runners are noise), which is why the
# benchmark suite is excluded here and runs on its own workflow.

name: ci

on:
  # Manual dispatch only. gate-selfhosted.yml is the merge gate; the paid runners
  # fire on demand so they stop failing every push (X0a). Old triggers: git history.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    # Observed 2026-10: ruff/mypy ~1 min, gates 1-4 min; regression-gate is slower (see its note).
    # A hung run otherwise burns the 6h default (failed runs reached 2h+).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ruff
        # Pinned: ruff ships new lint rules in minor releases, which turn
        # previously-green code red with zero code change. Bump deliberately
        # alongside a lint pass, not implicitly on every CI run. Version
        # mirrors the [lint] dev-deps group in pyproject.toml.
        run: pip install ruff==0.15.22
      - name: Lint
        run: ruff check src tests testflight scripts
      - name: Format check
        run: ruff format --check src tests testflight scripts

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # mypy 2.3.0 and the [cloud] stubs come from uv.lock (lint and cloud extras); cloud keeps
      # connectors/gcs.py's google.api_core/google.oauth2 imports resolvable.
      - uses: ./.github/actions/lock-env
        with:
          bootstrap: "true"
      - name: Type check
        # testflight/ holds real runner+invariant logic (acceptance suite); it
        # lives outside src/tests so it must be named explicitly. scripts/ stays
        # out of mypy (pre-existing untyped perf scripts) but is ruff-gated above.
        run: mypy src/decoy_engine testflight

  # regression-gate: ONE job that vets every change across all correctness
  # families. It runs the whole non-benchmark suite in a single invocation
  # (fast, and one run cannot silently drop a directory the way N separate
  # pytest calls could), preceded by a routing guard that fails if any named
  # suite directory is renamed or removed without updating the list below.
  # Full module-to-suite map: docs/ci-regression-gate.md.
  #
  #   relational   : tests/integration/golden (row-count / FK / join invariants)
  #   parity       : tests/parity (cross-route byte-parity: chunked-substrate + out-of-core FK)
  #   determinism  : tests/unit/determinism + tests/integration/golden
  #   golden       : tests/integration/golden (engine-v2 S1 fixtures)
  #   quality      : tests/unit/quality + tests/snapshots (fidelity / privacy / DCR + frozen snapshots)
  #   sentry       : tests/sentry (source-policy guards)
  #   security     : tests/security
  #   privacy      : tests/privacy
  #
  # parity, substrate-matrix, benchmark, and docs stay as separate workflows.
  regression-gate:
    runs-on: ubuntu-latest
    # Measured 2026-11-05 on the pip install: job 66m44s, pytest 1:05:34 (run 42026173384).
    # See the ruff job note on why a cap is needed.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 so origin/main is reachable in the checkout.
          # tests/sentry/test_physical_seam_disconnection.py's byte-identical
          # diff gate (Part 2) diffs against merge-base(origin/main, HEAD) and
          # SKIPS when origin/main is absent; the default depth-1 checkout made
          # it skip on every run, so the refactor-safety gate never actually
          # ran in CI (§SEAM-SENTRY-CI). Matches compat-preflight / regression-proof.
          fetch-depth: 0
      # The Mac gate's profile (bootstrap.sh): dev, lint, vault, cloud. cloud: tests/unit/test_v2_cloud_sources.py
      # mocks google.cloud.storage and boto3 directly; lint: scripts/dev/gates.sh needs ruff. No mimesis, ner, geo, ml or perf.
      - uses: ./.github/actions/lock-env
        with:
          bootstrap: "true"
      - name: Install strace (the file-access runtime detector; it fails, never skips, without it)
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Routing guard (every named suite directory must exist)
        run: |
          for d in \
            tests/unit/determinism \
            tests/unit/quality \
            tests/snapshots \
            tests/parity \
            tests/integration/golden \
            tests/sentry \
            tests/fileaccess \
            tests/security \
            tests/privacy ; do
            test -d "$d" || { echo "MISSING SUITE DIR: $d"; exit 1; }
          done
      - name: Regression gate (full suite, benchmarks excluded)
        # `not packaging` too: the packaging module is collected here (it lives
        # under tests/) and only skips today because `build` is absent from
        # .[dev]; excluding the marker makes the dedicated packaging-gate its
        # unambiguous owner rather than relying on that transitive absence.
        # `not codspeed` for the same reason: tests/codspeed/ uses the
        # pytest-codspeed `benchmark` fixture, which needs the [perf] extra
        # this job does not install; excluding the marker keeps that missing
        # optional dependency from ever being a fixture-not-found failure
        # here. The dedicated codspeed workflow is its unambiguous owner.
        # --junitxml: written for Mergify's merge-queue / flaky-test
        # detection (see the upload step below); this job's own pass/fail
        # is still the pytest exit code, unaffected by the flag.
        # --ignore: the layer test needs import-linter, which this certified profile lacks; the
        # layers-gate job below owns it.
        run: >
          pytest tests -m "not benchmark and not packaging and not codspeed"
          --ignore=tests/sentry/layout/test_import_layers.py
          --tb=short --durations=25 --junitxml=junit-results.xml

      # Mergify consumes this artifact for merge-queue flaky-test detection
      # once the app is installed (CAM-STEPS.md). `if: always()` so a failing
      # run still uploads its results -- that is the case Mergify most needs
      # to see. No-op today: nothing reads this artifact until the Mergify
      # GitHub app is installed on the repo.
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: junit-results.xml
          retention-days: 14

  # layers-gate: the engine import-layer contract (.importlinter, LAYOUT E3). Same isolated route
  # as the local gate: gates.sh syncs .venv-layers (dev plus the `layers` extra) from uv.lock and
  # runs only tests/sentry/layout/test_import_layers.py there. The certified profile above never
  # gets import-linter.
  layers-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10.20"
      - name: Import layers (isolated venv)
        run: bash scripts/dev/gates.sh --steps layers

  # ml-gate: reproduces the frozen lgbm-v1 golden pack. scikit-learn and lightgbm are base
  # dependencies (SCAN-ML M2), so `dev` alone installs them; this job stays separate so an ML
  # failure is legible at a glance. test_lightgbm_regression_retrain re-trains under the EXACT
  # pins in pyproject.toml and asserts the metrics match the committed baseline within 1e-4.
  #
  # Selection is by the `ml` marker (pytest -m ml overrides the addopts -m), NOT a
  # hand-maintained path list: a new ML test module joins the gate by adding
  # `pytestmark = pytest.mark.ml`, so coverage cannot silently shrink. The `ml`-marked tests
  # also run in regression-gate, where they importorskip only if lightgbm cannot import.
  ml-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lock-env
        with:
          extras: "dev"
      - name: ML gate (golden retrain + provenance + privacy + classify)
        run: pytest -m ml --tb=short

  # base-install: AT-M2a. A venv synced with NO extras (the engine's base dependencies only)
  # loads the bundled classifier pack and classifies a frame. This is the proof that moving
  # scikit-learn and lightgbm into the base list left a plain install working. The macOS
  # (libomp) and Windows lanes are checked on the Mac mini and by hand; see the M2 build record.
  base-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lock-env
      - name: Classifier runs from the base install
        run: python scripts/dev/base_install_smoke.py

  # ner-gate: regression-gate installs .[dev] only, so every NER test skips there
  # and a broken `ner` install (spaCy imports click, which typer no longer pulls
  # in) went unseen. The model is not on PyPI and `spacy download` is an unpinned
  # network install, so the wheel pinned in NER_MODEL_WHEELS is fetched,
  # hash-checked and installed from a local path. DECOY_REQUIRE_NER makes an
  # empty install fail the `ner` tests instead of skipping them.
  ner-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DECOY_REQUIRE_NER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lock-env
        with:
          extras: "dev ner"
      - name: Install the pinned spaCy model wheel
        run: |
          pin() { python -c "from decoy_engine.detection.ner import DEFAULT_NER_MODEL as m, DEFAULT_NER_MODEL_VERSION as v, NER_MODEL_WHEELS as w; print(w[(m, v)].$1)"; }
          url=$(pin url)
          sha=$(pin sha256)
          mkdir -p "$RUNNER_TEMP/ner-model"
          wheel="$RUNNER_TEMP/ner-model/$(basename "$url" .whl).whl"
          curl --fail --silent --show-error --location --output "$wheel" "$url"
          echo "$sha  $wheel" | sha256sum --check -
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" --no-deps "$wheel"
      - name: NER gate (import spaCy, load the model, find person and location)
        run: pytest -m ner --tb=short

  # packaging-gate: builds an actual wheel and asserts it ships the default ML
  # model pack + py.typed (DE-07). A clean wheel used to package only
  # src/decoy_engine and omit the pack (which lives under docs/), so
  # classify_fields silently returned None in every real install. This gate
  # builds the wheel from a clean checkout and inspects archive membership so
  # the force-include mapping cannot silently regress. Separate job because it
  # needs the `build` frontend and shells out; the test importorskips elsewhere.
  packaging-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # hatchling is the engine's build backend and is not in uv.lock; python -m build installs it
      # into an isolated env with pip, which reads PIP_CONSTRAINT (see .github/build-constraints.txt).
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lock-env
        with:
          extras: "dev"
      - name: Install the build frontend
        # build is not in uv.lock (L-e), so it is a named exact pin like ruff.
        run: uv pip install --python "$RUNNER_TEMP/venv/bin/python" build==1.2.2
      - name: Build frontend is importable (the packaging tests importorskip without it)
        run: python -c "import build"
      - name: Build backend is the pinned hatchling
        run: |
          # -v makes build print pip's resolution; without it the log never names the backend version.
          set -o pipefail
          python -m build -v --sdist --outdir "$RUNNER_TEMP/sdist-check" 2>&1 | tee "$RUNNER_TEMP/build.log"
          grep -q "hatchling-1.32.4" "$RUNNER_TEMP/build.log"
      - name: Packaging gate (wheel ships the model pack + py.typed)
        run: pytest -m packaging --tb=short

  # dp-certified-gate: `fit_dp_snapshot` only completes on the certified
  # 79-dist `dev+lint+vault` Python 3.10.20 profile (`dp_provenance.
  # check_fit_environment`); `regression-gate` above installs a different
  # profile, so the `dp_certified`-marked fit-success tests are collected
  # there but SKIPPED (tests/conftest.py's pytest_collection_modifyitems).
  # This job is their one certified home, and it is UNCONDITIONAL (this
  # workflow's own push/pull_request triggers, not a path filter) so a later
  # DP regression cannot dodge it the way a path-filtered workflow could.
  #
  # Three checks, in order: (1) the environment really is certified --
  # asserted directly against check_fit_environment, so a lock/profile drift
  # fails this job loudly instead of quietly turning every marked test into a
  # false skip; (2) the marked suites actually run; (3) the JUnit report is
  # parsed and the job fails unless at least one test passed and none were
  # skipped, errored, or failed -- a collect-only count cannot tell "ran and
  # passed" apart from "skipped", which is exactly the false-green this gate
  # exists to rule out.
  dp-certified-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Every uv run below must use the lock as is, never re-resolve.
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
      # The certified profile (dev+lint+vault+cloud: 77 dists, 79 once pytest-xdist joined `dev`) on the exact CPython patch. cloud is
      # required: google-cloud-storage does not survive without it, which fails
      # check_fit_environment() below. The dist set matches the pre-split 895b9a20... profile except
      # decoy-engine's own version, which is part of the hashed set: every engine version bump
      # re-pins the certified row (see dp_provenance._CERTIFIED_STACKS).
      - uses: ./.github/actions/lock-env
        with:
          extras: "dev lint vault cloud"
      - name: Assert this profile is certified (fail loud on drift)
        run: >
          uv run python -c
          "from decoy_engine.quality.dp_provenance import check_fit_environment;
          check_fit_environment(); print('CERTIFIED PROFILE OK')"
      - name: DP fit-success suite (certified profile)
        run: >
          uv run pytest -m dp_certified
          tests/unit/quality/test_dp.py
          tests/unit/quality/test_dp_flag_e2e.py
          tests/unit/generation/test_generate_dp_contract.py
          tests/unit/plan/test_generation_plan.py
          tests/unit/plan/test_serialize.py
          tests/unit/quality/test_dp_provenance.py
          --tb=short --junitxml=dp.xml
      - name: Guard -- the suite actually executed (passed>0, none skipped/errored/failed)
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("dp.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          passed = tests - failures - errors - skipped

          print(f"tests={tests} passed={passed} failures={failures} errors={errors} skipped={skipped}")
          if not (passed > 0 and skipped == 0 and errors == 0 and failures == 0):
              sys.exit(
                  "dp-certified-gate did not prove the suite ran clean on the certified "
                  f"profile: passed={passed} skipped={skipped} errors={errors} "
                  f"failures={failures} (need passed>0, all others 0)"
              )
          PY
      - name: License sentries against the certified profile's installed metadata
        # The one lock-exact CI venv: NOTICE is compared with installed metadata here.
        # DECOY_LICENSE_STRICT=1 turns the drifted-venv skip into a failure.
        env:
          DECOY_LICENSE_STRICT: "1"
        run: >
          uv run pytest tests/sentry/test_license_policy.py tests/sentry/test_sdv_import_sentry.py
          --tb=short -rs

# V2.0-prep CI workflow.
#
# Three separate jobs (ruff / mypy / regression-gate) so a failure points
# at the specific gate that tripped. ruff + mypy stay fast and focused;
# regression-gate runs the whole non-benchmark suite in one invocation,
# preceded by a routing guard that fails if a named suite directory is
# renamed or removed (so coverage cannot silently shrink).
#
# Why separate jobs and not one combined: a single shell-step setup keeps
# the YAML short, but combined jobs hide which gate broke the build. When a
# contributor sees "CI failed" they want "ruff" vs "mypy" vs
# "regression-gate" at a glance, not interleaved logs.
#
# Why no separate self-hosted runner yet: the lint + type + test tier runs
# comfortably on ubuntu-latest. Self-hosted infra arrives in V2.x for the
# benchmark guardrail (per engineering-best-practices section 7.3,
# sub-second perf numbers from shared runners are noise), which is why the
# benchmark suite is excluded here and runs on its own workflow.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ruff
        # Pinned: ruff ships new lint rules in minor releases, which turn
        # previously-green code red with zero code change. Bump deliberately
        # alongside a lint pass, not implicitly on every CI run. Version
        # mirrors the [lint] dev-deps group in pyproject.toml.
        run: pip install ruff==0.15.14
      - name: Lint
        run: ruff check src tests testflight scripts
      - name: Format check
        run: ruff format --check src tests testflight scripts

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install engine + dev extras
        # mypy pinned for the same reason as ruff: a minor bump can surface
        # new error categories on unchanged code. Version mirrors the [lint]
        # dev-deps group in pyproject.toml.
        run: pip install -e ".[dev]" mypy==2.1.0
      - name: Type check
        # testflight/ holds real runner+invariant logic (acceptance suite); it
        # lives outside src/tests so it must be named explicitly. scripts/ stays
        # out of mypy (pre-existing untyped perf scripts) but is ruff-gated above.
        run: mypy src/decoy_engine testflight

  # regression-gate: ONE job that vets every change across all correctness
  # families. It runs the whole non-benchmark suite in a single invocation
  # (fast, and one run cannot silently drop a directory the way N separate
  # pytest calls could), preceded by a routing guard that fails if any named
  # suite directory is renamed or removed without updating the list below.
  # Full module-to-suite map: docs/ci-regression-gate.md.
  #
  #   relational   : tests/integration/golden (row-count / FK / join invariants)
  #   parity       : tests/parity (pandas vs polars adapter)
  #   determinism  : tests/unit/determinism + tests/integration/golden
  #   golden       : tests/integration/golden (engine-v2 S1 fixtures)
  #   quality      : tests/unit/quality + tests/snapshots (fidelity / privacy / DCR + frozen snapshots)
  #   sentry       : tests/sentry (source-policy guards)
  #   security     : tests/security
  #   privacy      : tests/privacy
  #
  # parity, substrate-matrix, benchmark, and docs stay as separate workflows.
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install engine + dev extras
        run: pip install -e ".[dev]"
      - name: Routing guard (every named suite directory must exist)
        run: |
          for d in \
            tests/unit/determinism \
            tests/unit/quality \
            tests/snapshots \
            tests/parity \
            tests/integration/golden \
            tests/sentry \
            tests/security \
            tests/privacy ; do
            test -d "$d" || { echo "MISSING SUITE DIR: $d"; exit 1; }
          done
      - name: Regression gate (full suite, benchmarks excluded)
        run: pytest tests -m "not benchmark" --tb=short

  # ml-gate: activates the ML field-recognition tests that importorskip
  # themselves out of the regression-gate above (which installs .[dev] only,
  # so scikit-learn + lightgbm are absent and the retrain gate silently
  # skips). This job installs .[dev,ml] and runs every test marked `ml` so the
  # frozen golden pack (docs/v2/ml/packs/lgbm-v1) is actually reproduced in CI:
  # test_lightgbm_regression_retrain re-trains under the EXACT-pinned
  # scikit-learn/lightgbm (see the [ml] extra in pyproject.toml) and asserts
  # the metrics match the committed baseline within 1e-4. Kept separate from
  # regression-gate so an ML failure is legible at a glance and the pinned ML
  # deps do not slow the main gate.
  #
  # Selection is by the `ml` marker (pytest -m ml overrides the addopts -m),
  # NOT a hand-maintained path list: a new ML test module joins the gate by
  # adding `pytestmark = pytest.mark.ml`, so coverage cannot silently shrink
  # the way an unlisted path would. The `ml`-marked tests still run in
  # regression-gate too (ml is not benchmark), importorskip-skipping there
  # without the extra.
  ml-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install engine + dev + ml extras
        run: pip install -e ".[dev,ml]"
      - name: ML gate (golden retrain + provenance + privacy + classify)
        run: pytest -m ml --tb=short

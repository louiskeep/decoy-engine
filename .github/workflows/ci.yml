# V2.0-prep CI workflow.
#
# Three separate jobs (ruff / mypy / regression-gate) so a failure points
# at the specific gate that tripped. ruff + mypy stay fast and focused;
# regression-gate runs the whole non-benchmark suite in one invocation,
# preceded by a routing guard that fails if a named suite directory is
# renamed or removed (so coverage cannot silently shrink).
#
# Why separate jobs and not one combined: a single shell-step setup keeps
# the YAML short, but combined jobs hide which gate broke the build. When a
# contributor sees "CI failed" they want "ruff" vs "mypy" vs
# "regression-gate" at a glance, not interleaved logs.
#
# Why no separate self-hosted runner yet: the lint + type + test tier runs
# comfortably on ubuntu-latest. Self-hosted infra arrives in V2.x for the
# benchmark guardrail (per engineering-best-practices section 7.3,
# sub-second perf numbers from shared runners are noise), which is why the
# benchmark suite is excluded here and runs on its own workflow.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ruff
        # Pinned: ruff ships new lint rules in minor releases, which turn
        # previously-green code red with zero code change. Bump deliberately
        # alongside a lint pass, not implicitly on every CI run. Version
        # mirrors the [lint] dev-deps group in pyproject.toml.
        run: pip install ruff==0.15.14
      - name: Lint
        run: ruff check src tests testflight scripts
      - name: Format check
        run: ruff format --check src tests testflight scripts

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install engine + dev extras
        # mypy pinned for the same reason as ruff: a minor bump can surface
        # new error categories on unchanged code. Version mirrors the [lint]
        # dev-deps group in pyproject.toml.
        run: pip install -e ".[dev]" mypy==2.1.0
      - name: Type check
        # testflight/ holds real runner+invariant logic (acceptance suite); it
        # lives outside src/tests so it must be named explicitly. scripts/ stays
        # out of mypy (pre-existing untyped perf scripts) but is ruff-gated above.
        run: mypy src/decoy_engine testflight

  # regression-gate: ONE job that vets every change across all correctness
  # families. It runs the whole non-benchmark suite in a single invocation
  # (fast, and one run cannot silently drop a directory the way N separate
  # pytest calls could), preceded by a routing guard that fails if any named
  # suite directory is renamed or removed without updating the list below.
  # Full module-to-suite map: docs/ci-regression-gate.md.
  #
  #   relational   : tests/integration/golden (row-count / FK / join invariants)
  #   parity       : tests/parity (pandas vs polars adapter)
  #   determinism  : tests/unit/determinism + tests/integration/golden
  #   golden       : tests/integration/golden (engine-v2 S1 fixtures)
  #   quality      : tests/unit/quality + tests/snapshots (fidelity / privacy / DCR + frozen snapshots)
  #   sentry       : tests/sentry (source-policy guards)
  #   security     : tests/security
  #   privacy      : tests/privacy
  #
  # parity, substrate-matrix, benchmark, and docs stay as separate workflows.
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install engine + dev extras
        run: pip install -e ".[dev]"
      - name: Routing guard (every named suite directory must exist)
        run: |
          for d in \
            tests/unit/determinism \
            tests/unit/quality \
            tests/snapshots \
            tests/parity \
            tests/integration/golden \
            tests/sentry \
            tests/security \
            tests/privacy ; do
            test -d "$d" || { echo "MISSING SUITE DIR: $d"; exit 1; }
          done
      - name: Regression gate (full suite, benchmarks excluded)
        # `not packaging` too: the packaging module is collected here (it lives
        # under tests/) and only skips today because `build` is absent from
        # .[dev]; excluding the marker makes the dedicated packaging-gate its
        # unambiguous owner rather than relying on that transitive absence.
        # `not codspeed` for the same reason: tests/codspeed/ uses the
        # pytest-codspeed `benchmark` fixture, which needs the [perf] extra
        # this job does not install; excluding the marker keeps that missing
        # optional dependency from ever being a fixture-not-found failure
        # here. The dedicated codspeed workflow is its unambiguous owner.
        # --junitxml: written for Mergify's merge-queue / flaky-test
        # detection (see the upload step below); this job's own pass/fail
        # is still the pytest exit code, unaffected by the flag.
        run: >
          pytest tests -m "not benchmark and not packaging and not codspeed"
          --tb=short --junitxml=junit-results.xml

      # Mergify consumes this artifact for merge-queue flaky-test detection
      # once the app is installed (CAM-STEPS.md). `if: always()` so a failing
      # run still uploads its results -- that is the case Mergify most needs
      # to see. No-op today: nothing reads this artifact until the Mergify
      # GitHub app is installed on the repo.
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: junit-results.xml
          retention-days: 14

  # ml-gate: activates the ML field-recognition tests that importorskip
  # themselves out of the regression-gate above (which installs .[dev] only,
  # so scikit-learn + lightgbm are absent and the retrain gate silently
  # skips). This job installs .[dev,ml] and runs every test marked `ml` so the
  # frozen golden pack (docs/v2/ml/packs/lgbm-v1) is actually reproduced in CI:
  # test_lightgbm_regression_retrain re-trains under the EXACT-pinned
  # scikit-learn/lightgbm (see the [ml] extra in pyproject.toml) and asserts
  # the metrics match the committed baseline within 1e-4. Kept separate from
  # regression-gate so an ML failure is legible at a glance and the pinned ML
  # deps do not slow the main gate.
  #
  # Selection is by the `ml` marker (pytest -m ml overrides the addopts -m),
  # NOT a hand-maintained path list: a new ML test module joins the gate by
  # adding `pytestmark = pytest.mark.ml`, so coverage cannot silently shrink
  # the way an unlisted path would. The `ml`-marked tests still run in
  # regression-gate too (ml is not benchmark), importorskip-skipping there
  # without the extra.
  ml-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install engine + dev + ml extras
        run: pip install -e ".[dev,ml]"
      - name: ML gate (golden retrain + provenance + privacy + classify)
        run: pytest -m ml --tb=short

  # packaging-gate: builds an actual wheel and asserts it ships the default ML
  # model pack + py.typed (DE-07). A clean wheel used to package only
  # src/decoy_engine and omit the pack (which lives under docs/), so
  # classify_fields silently returned None in every real install. This gate
  # builds the wheel from a clean checkout and inspects archive membership so
  # the force-include mapping cannot silently regress. Separate job because it
  # needs the `build` frontend and shells out; the test importorskips elsewhere.
  packaging-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install engine + dev extras + build frontend
        # build pinned like ruff/mypy: a frontend bump should be deliberate.
        run: pip install -e ".[dev]" build==1.2.2
      - name: Packaging gate (wheel ships the model pack + py.typed)
        run: pytest -m packaging --tb=short

  # dp-certified-gate: `fit_dp_snapshot` only completes on the certified
  # 77-dist `dev+lint+vault` Python 3.10.20 profile (`dp_provenance.
  # check_fit_environment`); `regression-gate` above installs a different
  # profile, so the `dp_certified`-marked fit-success tests are collected
  # there but SKIPPED (tests/conftest.py's pytest_collection_modifyitems).
  # This job is their one certified home, and it is UNCONDITIONAL (this
  # workflow's own push/pull_request triggers, not a path filter) so a later
  # DP regression cannot dodge it the way a path-filtered workflow could.
  #
  # Three checks, in order: (1) the environment really is certified --
  # asserted directly against check_fit_environment, so a lock/profile drift
  # fails this job loudly instead of quietly turning every marked test into a
  # false skip; (2) the marked suites actually run; (3) the JUnit report is
  # parsed and the job fails unless at least one test passed and none were
  # skipped, errored, or failed -- a collect-only count cannot tell "ran and
  # passed" apart from "skipped", which is exactly the false-green this gate
  # exists to rule out.
  dp-certified-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Pin the exact certified CPython patch
        run: uv python install 3.10.20
      - name: Sync the certified profile (77-dist dev+lint+vault)
        run: uv sync --frozen --extra dev --extra lint --extra vault --python 3.10.20
      - name: Assert this profile is certified (fail loud on drift)
        run: >
          uv run python -c
          "from decoy_engine.quality.dp_provenance import check_fit_environment;
          check_fit_environment(); print('CERTIFIED PROFILE OK')"
      - name: DP fit-success suite (certified profile)
        run: >
          uv run pytest -m dp_certified
          tests/unit/quality/test_dp.py
          tests/unit/quality/test_dp_flag_e2e.py
          tests/unit/generation/test_generate_dp_contract.py
          tests/unit/plan/test_generation_plan.py
          tests/unit/plan/test_serialize.py
          tests/unit/quality/test_dp_provenance.py
          --tb=short --junitxml=dp.xml
      - name: Guard -- the suite actually executed (passed>0, none skipped/errored/failed)
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("dp.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          passed = tests - failures - errors - skipped

          print(f"tests={tests} passed={passed} failures={failures} errors={errors} skipped={skipped}")
          if not (passed > 0 and skipped == 0 and errors == 0 and failures == 0):
              sys.exit(
                  "dp-certified-gate did not prove the suite ran clean on the certified "
                  f"profile: passed={passed} skipped={skipped} errors={errors} "
                  f"failures={failures} (need passed>0, all others 0)"
              )
          PY
